# Talking to the keepers at Lantern Dock with a full hold. Tova introduces herself once,
# one short line at a time; after that she says one line that follows the shift. Each
# conversation is one log entry naming her and the station, a line heard again is not
# logged again, and talk never becomes the flight message. Hints retire after use,
# and name signs show only in their keeper's own room.
seed = 3
ticks = 1798

[[input]]
tick = 1
name = "core.ahead"
payload = { down = true }
[[input]]
tick = 11
name = "core.ahead"
payload = { down = false }
# Mining three times teaches Space: its hint retires from later messages.
[[input]]
tick = 60
name = "core.mine"
[[input]]
tick = 61
name = "core.mine"
[[input]]
tick = 62
name = "core.mine"
[[input]]
tick = 960
name = "core.dock"
payload = { station = "core.lantern" }
[[input]]
tick = 1488
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 1434 }

# E has not been used yet, so the full hold still says what E does.
[[expect]]
tick = 959
entity = "log4"
component = "entry"
field = "text"
equals = "Hold full: 24 ore aboard."

# Each keeper wears a name sign in their own room: in the exchange Tova wears hers,
# and Bram, in his office, none.
[[input]]
tick = 1568
name = "core.open"
[[input]]
tick = 1571
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_exchange_room", start_tick = 1568 }
[[expect]]
tick = 1577
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = "Tova Reyes"
[[expect]]
tick = 1577
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = ""

# The repeat line can't jump ahead of the introduction: the engine refuses it.
[[input]]
tick = 1593
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_talk" }
[[expect]]
tick = 1594
entity = "lantern_trader_talk"
component = "engine.talk"
field = "active"
equals = false

# The introduction, one line per click.
[[input]]
tick = 1598
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_intro" }
[[expect]]
tick = 1599
entity = "lantern_trader_intro"
component = "engine.talk"
field = "current"
equals = "core.lantern_trader_intro1"
[[input]]
tick = 1603
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro1" }
[[expect]]
tick = 1604
entity = "lantern_trader_intro"
component = "engine.talk"
field = "current"
equals = "core.lantern_trader_intro2"
[[input]]
tick = 1608
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro2" }
[[input]]
tick = 1613
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro3" }
[[expect]]
tick = 1614
entity = "lantern_trader_intro"
component = "engine.talk"
field = "seen"
equals = true
# The whole introduction is one entry, in reading order, naming speaker and station.
[[expect]]
tick = 1615
entity = "log6"
component = "entry"
field = "text"
equals = "Tova Reyes at Lantern Dock: “I'm Tova, and I run the exchange.” “I buy ore, and plate for our galley: sheet the Kiln fires from ore.” “My prices drop as my stock fills.”"
[[expect]]
tick = 1615
entity = "ship"
component = "pilot"
field = "message"
equals = "Docked at Lantern Dock."

# Clicked again, she speaks about the hold aboard instead of repeating herself.
[[expect]]
tick = 1615
entity = "lantern_trader_now"
component = "engine.talk_line"
field = "text"
equals = "I'll take your 24 ore whenever you like."
[[expect]]
tick = 1615
entity = "lantern_master_now"
component = "engine.talk_line"
field = "text"
equals = "The galley still needs 40 plate."
[[input]]
tick = 1618
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_talk" }
[[input]]
tick = 1623
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_talk", line = "core.lantern_trader_now" }
[[expect]]
tick = 1624
entity = "log7"
component = "entry"
field = "text"
equals = "Tova Reyes at Lantern Dock: “I'll take your 24 ore whenever you like.”"

# The same line heard again adds nothing to the log.
[[input]]
tick = 1628
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_talk" }
[[input]]
tick = 1633
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_talk", line = "core.lantern_trader_now" }
[[expect]]
tick = 1634
entity = "ship"
component = "pilot"
field = "logged"
equals = 7

# Out to the station and in again: while the cut runs no sign is worn; once it
# lands, only the exchange's keeper wears hers. After a sale her line follows it.
[[input]]
tick = 1635
name = "core.close"
payload = { down = true }
[[input]]
tick = 1636
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 1635 }
[[input]]
tick = 1638
name = "core.open"
[[expect]]
tick = 1638
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 1639
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_exchange_room", start_tick = 1638 }
[[expect]]
tick = 1639
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = ""
[[expect]]
tick = 1639
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = "Tova Reyes"
[[input]]
tick = 1648
name = "core.sell"
[[expect]]
tick = 1649
entity = "lantern_trader_now"
component = "engine.talk_line"
field = "text"
equals = "Thanks. It's all on the pile already."
[[input]]
tick = 1658
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_talk" }
[[input]]
tick = 1663
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_talk", line = "core.lantern_trader_now" }
[[expect]]
tick = 1664
entity = "log9"
component = "entry"
field = "text"
equals = "Tova Reyes at Lantern Dock: “Thanks. It's all on the pile already.”"

# Talk to the office keeper in his office and leave mid-introduction: launching ends
# the talk unseen.
[[input]]
tick = 1718
name = "core.open"
payload = { facility = "core.lantern_office" }
[[input]]
tick = 1721
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_office_room", start_tick = 1718 }
[[input]]
tick = 1728
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_master_intro" }
[[input]]
tick = 1733
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro1" }
[[expect]]
tick = 1734
entity = "lantern_master_intro"
component = "engine.talk"
field = "active"
equals = true
[[input]]
tick = 1738
name = "core.launch"
[[expect]]
tick = 1740
entity = "lantern_master_intro"
component = "engine.talk"
field = "active"
equals = false
[[expect]]
tick = 1740
entity = "lantern_master_intro"
component = "engine.talk"
field = "seen"
equals = false
# Mining was used three times, so the launch message no longer explains Space.
[[expect]]
tick = 1740
entity = "ship"
component = "pilot"
field = "message"
equals = "Launched from Lantern Dock."
[[expect]]
entity = "ship"
component = "taught"
field = "mine"
equals = 3
[[expect]]
entity = "ship"
component = "taught"
field = "talk"
equals = 3

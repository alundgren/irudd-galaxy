[[expect]]
tick = 660
entity = "ship"
component = "radio"
field = "channel"
equals = "core.kiln_radio"

[[expect]]
tick = 660
facts = "radio_kiln"
equals = 2

# Prev: back to Lantern Dock.
[[expect]]
tick = 720
entity = "ship"
component = "radio"
field = "channel"
equals = "core.lantern_radio"

[[expect]]
tick = 720
facts = "radio_lantern"
equals = 2

# R steps on to Cinder Kiln, then past the last channel: off. R again: on, at the

# Sefa never asks twice (scripts/rumour.luau): her question, answered with the ring,
# then the exchange is left before her reply is through. Back in the exchange and
# clicking her, she picks up her reply where it stopped; "See anything odd out there?" is
# not asked again. Heard to its end, the talk is put away.
#
# Starts on Lantern Dock's berth with the galley one plate short, that plate aboard and
# credits for a ration (set, not played): the galley is built, her gift taken, Ines's
# ask accepted after a counted docking, and Sefa met at the Kiln with her lead heard.
# The trips are set, not flown: the ship is put by the stone ring so it wakes, then on
# the Kiln's berth with the 8 glassite she wants. (How long the flight to the ring takes
# is glassite-lead.toml's.)

# Each rock yields its own ware: the ship turns west, flies the long way out to the ice
# drift and presses Space, and the nearest rock is ice3, a small pale floe. The order cuts
# it down and moves on through the drift until 24 ice fill the hold, none of it ore.
seed = 7
ticks = 2000

[[input]]
tick = 1
name = "left"
payload = { down = true }

[[input]]
tick = 31
name = "left"
payload = { down = false }

[[input]]
tick = 35
name = "ahead"
payload = { down = true }

[[input]]
tick = 900
name = "ahead"
payload = { down = false }

[[input]]
tick = 960
name = "mine"

[[expect]]
tick = 962
entity = "ship"
component = "pilot"
field = "target"
equals = "core.ice3"

[[expect]]
entity = "ship"
component = "hold"
field = "ice"
equals = 24

[[expect]]
entity = "ship"
component = "hold"
field = "ore"
equals = 0

[[expect]]
entity = "ice3"
component = "ore"
field = "left"
equals = 0

[[expect]]
entity = "ship"
component = "pilot"
field = "message"
equals = "Hold full: 24 ice aboard."

[[expect]]
facts = "mined"
equals = 24

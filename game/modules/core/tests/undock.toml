# Flying straight off the dock: docked, Shift alone does nothing, but W flies the ship
# off on the tick it is pressed, facing away from the station, with no separate undock
# step; the ship leaves in a straight line, and letting go coasts to a stop in a second.
# Docked again at Cinder Kiln, D (a turn) flies it off too, turning as it goes.
seed = 7
ticks = 2281

[[input]]
tick = 1
name = "dock"
payload = { station = "core.lantern" }

[[input]]
tick = 819
name = "boost"
payload = { down = true }

[[input]]
tick = 820
name = "boost"
payload = { down = false }

[[input]]
tick = 869
name = "ahead"
payload = { down = true }

[[input]]
tick = 899
name = "ahead"
payload = { down = false }

[[input]]
tick = 969
name = "dock"
payload = { station = "core.kiln" }

[[input]]
tick = 2221
name = "right"
payload = { down = true }

[[input]]
tick = 2231
name = "right"
payload = { down = false }

# Shift alone leaves the ship moored.
[[expect]]
tick = 868
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"

# W: out in the reach on the same tick, facing away from Lantern Dock (its berth faces
# the station at -2.60), and thrusting.
[[expect]]
tick = 869
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.reach"

[[expect]]
tick = 869
entity = "ship"
component = "engine.position"
field = "angle"
at_least = 0.54
[[expect]]
tick = 869
entity = "ship"
component = "engine.position"
field = "angle"
at_most = 0.55

[[expect]]
tick = 869
entity = "ship"
component = "engine.helm"
field = "thrust"
equals = 1.0

# A straight line away from the berth at (-14, -12), not into the station.
[[expect]]
tick = 899
entity = "ship"
component = "engine.position"
field = "x"
at_least = -306
[[expect]]
tick = 899
entity = "ship"
component = "engine.position"
field = "angle"
at_most = 0.55

# Let go at 230: stopped a second later.
[[expect]]
tick = 931
entity = "ship"
component = "engine.motion"
field = "vx"
equals = 0.0

[[expect]]
tick = 2220
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.kiln"

# D flies it off Cinder Kiln too, turning right as it goes.
[[expect]]
tick = 2221
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.reach"

[[expect]]
tick = 2221
entity = "ship"
component = "engine.helm"
field = "turn"
equals = -1.0

[[expect]]
facts = "docked"
equals = 2

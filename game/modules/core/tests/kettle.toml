# After the greenhouse, Cold Kettle adrift (scripts/salvage.luau, scripts/tow.luau), kept
# at Lantern Dock, played end to end from a finished greenhouse: Noor's ask in the galley
# (Accept), out to the barge and a line passed, towed into Lantern Dock's berth and
# handed to Bram with the office's handover button, 12 plate bought at the Kiln and
# handed to Bram for her pipes, and two trips out and back: the beds bloom, Hessa lives
# aboard, the exchange buys more ice, Noor thanks you and Lantern Dock eats together for
# three dockings. By hand the tow is slower and swings wide (kettle-choices.toml slips it
# on the ice).
#
# Starts on Lantern Dock's berth with the galley one plate short, that plate aboard,
# credits for the shopping and the day as the trade route's trades leave it (set, not
# played through the trade route). From there it
# plays the greenhouse as greenhouse.toml does, with every trip set, not flown: the
# launch, what the hold carries after it, "away" where the trip was a visit, and the ship
# put on the next berth to dock (the glassite trip stops by the stone ring, so it wakes).
# The barge's trips are set too: the ship is put alongside her and passes the line by a
# script's order, then ship and barge are put by Lantern Dock's berth, the line still
# fast, and the ship docks.

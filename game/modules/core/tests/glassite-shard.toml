# The loose glassite shards are solid (start.toml, glassite_shard1 to 4). Launched from
# Cinder Kiln's berth, the ship turns by keys to 9 degrees east of north and flies straight
# on, by keys alone, at glassite_shard1's centre. It knocks against the shard (a contact
# and a bump) and is turned aside round it, not passed through, then flies on past it.
seed = 7
ticks = 961

# Starts just off Cinder Kiln's berth, docking, with the shard turned as far as the
# route there leaves it (it spins; the knock depends on its turn).
[[edit]]
entity = "glassite_shard1"
component = "engine.position"
set = { angle = 0.6283185307179585 }
[[edit]]
entity = "ship"
component = "engine.position"
set = { x = 200, y = -249 }
[[input]]
tick = 1
name = "core.dock"
source = "script"
payload = { station = "core.kiln" }

[[input]]
tick = 60
name = "core.launch"

[[input]]
tick = 100
name = "core.right"
payload = { down = true }

[[input]]
tick = 109
name = "core.right"
payload = { down = false }

[[input]]
tick = 120
name = "core.ahead"
payload = { down = true }

# On course for the shard's centre, not yet there.
[[expect]]
tick = 840
entity = "ship"
component = "engine.position"
field = "x"
at_least = 279

[[expect]]
tick = 840
entity = "ship"
component = "engine.position"
field = "x"
at_most = 282

[[expect]]
tick = 840
facts = "bump"
equals = 0

# It meets the shard: a knock, not a pass through.
[[expect]]
tick = 900
facts = "engine.contact"
at_least = 1

[[expect]]
tick = 900
facts = "bump"
equals = 1

# Turned aside east of the straight line it was on (about x 288 there), and not held:
# it flies on past.
[[expect]]
tick = 920
entity = "ship"
component = "engine.position"
field = "x"
at_least = 291

[[expect]]
tick = 960
entity = "ship"
component = "engine.position"
field = "y"
at_least = 280

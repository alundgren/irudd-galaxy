# Ines's gift, taken: once the galley stands and she has introduced herself, a click
# gets her offer of a ration on the house in place of her everyday line. Taking it puts
# one in the hold with a receipt; after that the offer never comes back.
#
# Starts on Lantern Dock's berth with the galley one plate short, that plate aboard and
# credits for a hold of rations (set, not played through the trade route); the sale in
# the exchange builds the galley, and her room is opened.
seed = 7
ticks = 75

[[edit]]
entity = "ship"
component = "engine.position"
set = { x = -184, y = -203, angle = -2.601173153319209 }
[[edit]]
entity = "ship"
component = "hold"
set = { plate = 1 }
[[edit]]
entity = "ship"
component = "pilot"
set = { credits = 1000 }
[[edit]]
entity = "lantern_galley"
component = "build"
set = { given = 39 }

[[input]]
tick = 1
name = "core.dock"
payload = { station = "core.lantern" }
[[input]]
tick = 8
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 2 }

[[input]]
tick = 15
name = "core.open"
[[input]]
tick = 25
name = "core.sell"
[[input]]
tick = 45
name = "core.open"
payload = { facility = "core.lantern_galley" }
[[input]]
tick = 48
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_galley_room", start_tick = 45 }
# Not offered before her introduction is heard; the story comes first.
[[expect]]
tick = 49
entity = "lantern_cook_gift"
component = "engine.talk"
field = "enabled"
equals = true
[[input]]
tick = 50
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_cook_intro" }
[[input]]
tick = 51
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_intro", line = "core.lantern_cook_intro1" }
[[input]]
tick = 52
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_intro", line = "core.lantern_cook_intro2" }
[[input]]
tick = 53
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_intro", line = "core.lantern_cook_intro3" }
[[expect]]
tick = 54
entity = "lantern_cook_gift"
component = "engine.talk"
field = "enabled"
equals = true
[[expect]]
tick = 54
entity = "lantern_cook_talk"
component = "engine.talk"
field = "enabled"
equals = false
[[input]]
tick = 55
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_cook_gift" }
[[expect]]
tick = 55
entity = "lantern_cook_gift"
component = "engine.talk"
field = "active"
equals = true
[[input]]
tick = 56
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_gift", line = "core.lantern_cook_gift1" }
# Take it.
[[input]]
tick = 57
name = "engine.talk_chosen"
source = "ui"
payload = { talk = "core.lantern_cook_gift", line = "core.lantern_cook_gift2", choice = "core.lantern_cook_gift_take" }
[[expect]]
tick = 57
entity = "ship"
component = "hold"
field = "rations"
equals = 1
[[expect]]
tick = 57
entity = "lantern_cook_gift"
component = "gift"
field = "answered"
equals = true
[[expect]]
tick = 57
entity = "ship"
component = "pilot"
field = "message"
equals = "Ines Varga gave you rations: 1 into the hold."
[[expect]]
tick = 57
entity = "lantern_cook_gift"
component = "engine.talk"
field = "current"
equals = "core.lantern_cook_gift3"
# Her answer stays up until it is heard, though her lines follow the answer at once.
[[expect]]
tick = 58
entity = "lantern_cook_gift"
component = "engine.talk"
field = "current"
equals = "core.lantern_cook_gift3"
[[input]]
tick = 59
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_gift", line = "core.lantern_cook_gift3" }
[[expect]]
tick = 59
entity = "lantern_cook_gift"
component = "engine.talk"
field = "enabled"
equals = false
# Her ask for more waits until the player has flown out and come back (galley-lived.toml):
# her everyday talk is back.
[[expect]]
tick = 59
entity = "greenhouse_ask"
component = "engine.talk"
field = "enabled"
equals = false
[[expect]]
tick = 59
entity = "lantern_cook_talk"
component = "engine.talk"
field = "enabled"
equals = true
# One log entry holds the conversation and the answer; the receipt is the next.
[[expect]]
tick = 59
entity = "ship"
component = "pilot"
field = "logged"
equals = 5
[[expect]]
tick = 59
entity = "log4"
component = "entry"
field = "text"
equals = "Ines Varga at Lantern Dock: \u201CHear them? Crews at my table, eating hot. Your plate did that.\u201D \u201CWill you take a ration, on the house?\u201D You: Take it. \u201CThere. It's in your hold.\u201D"
# Clicking her again gets her everyday line, not the gift again: her galley at work, and
# an idea she'll tell on a later docking (the greenhouse, tests/greenhouse.toml).
[[input]]
tick = 60
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_cook_gift" }
[[expect]]
tick = 60
entity = "lantern_cook_gift"
component = "engine.talk"
field = "active"
equals = false
[[input]]
tick = 61
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_cook_talk" }
[[expect]]
tick = 61
entity = "lantern_cook_talk"
component = "engine.talk"
field = "active"
equals = true
[[expect]]
tick = 61
entity = "lantern_cook_now"
component = "engine.talk_line"
field = "text"
equals = "Look at them eat. Come by again; I've an idea brewing."
# Buying fills what is left of the hold.
[[input]]
tick = 65
name = "core.buy"
payload = { ware = "rations", units = 0 }
[[expect]]
tick = 65
entity = "ship"
component = "hold"
field = "rations"
equals = 24

# Fitting by clicks at Cinder Kiln's cradle: Choose picks a part up and changes nothing,
# choosing it again puts it back, and Fit here or Take it off here sends the same event a
# drop does, under the same verdicts. A fit or a removal ends the choice, and so does
# leaving the room. While a part is chosen the cradle keeper's name sign hides: the
# preview box stands where Orrin's walk to the ship passes, so his sign would sit under it
# at 960x540, and the panel names him meanwhile; Put back, or a fit, and the sign is worn
# again. Everything done in the station's rooms is logged at the station, one visit with
# its docking. The panel itself is tests/cradle-panel.luau.
#
# Starts beside Cinder Kiln's berth with a hold of ore and 2,879 credits: docked and the
# hold sold, the lens is in reach.
seed = 7
ticks = 140
[[edit]]
entity = "ship"
component = "pilot"
set = { credits = 2879 }
[[edit]]
entity = "ship"
component = "hold"
set = { ore = 24 }
[[edit]]
entity = "ship"
component = "engine.position"
set = { x = 200, y = -249 }
[[input]]
tick = 1
name = "core.dock"
source = "script"
payload = { station = "core.kiln" }
[[expect]]
tick = 50
facts = "core.docked"
equals = 1
[[input]]
tick = 50
name = "core.open"
[[input]]
tick = 60
name = "core.sell"
[[input]]
tick = 70
name = "core.open"
payload = { facility = "core.kiln_cradle" }
[[input]]
tick = 73
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.kiln_cradle_room", start_tick = 70 }

# Settled in the cradle: Orrin wears his sign.
[[expect]]
tick = 75
entity = "kiln_fitter"
component = "engine.life"
field = "name"
equals = "Orrin Vale"

# Chosen by a click: nothing changes yet, the preview shows first, and his sign goes.
[[input]]
tick = 80
name = "core.choose"
source = "ui"
payload = { value = "core.lens" }
[[expect]]
tick = 81
entity = "ship"
component = "pilot"
field = "chosen_part"
equals = "core.lens"
[[expect]]
tick = 81
entity = "lens"
component = "part"
field = "owned"
equals = false
[[expect]]
tick = 81
entity = "kiln_fitter"
component = "engine.life"
field = "name"
equals = ""

# Put back: chosen again, it is let go, and the sign is back.
[[input]]
tick = 85
name = "core.choose"
source = "ui"
payload = { value = "core.lens" }
[[expect]]
tick = 86
entity = "ship"
component = "pilot"
field = "chosen_part"
equals = ""
[[expect]]
tick = 86
entity = "kiln_fitter"
component = "engine.life"
field = "name"
equals = "Orrin Vale"

# Chosen, then Fit here: the same event a drop sends, bought and fitted, and the choice is
# done, so the sign is worn again.
[[input]]
tick = 90
name = "core.choose"
source = "ui"
payload = { value = "core.lens" }
[[expect]]
tick = 91
entity = "kiln_fitter"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 95
name = "core.fit"
source = "ui"
payload = { socket = "drill", value = "core.lens" }
[[expect]]
tick = 96
entity = "lens"
component = "part"
field = "fitted"
equals = true
[[expect]]
tick = 96
entity = "lens"
component = "part"
field = "owned"
equals = true
[[expect]]
tick = 96
entity = "ship"
component = "pilot"
field = "chosen_part"
equals = ""
[[expect]]
tick = 96
entity = "kiln_fitter"
component = "engine.life"
field = "name"
equals = "Orrin Vale"

# The thrusters, chosen: Fit here is refused on power, as a drop is, and nothing changes.
[[input]]
tick = 100
name = "core.choose"
source = "ui"
payload = { value = "core.thrusters" }
[[input]]
tick = 105
name = "core.fit"
source = "ui"
payload = { socket = "engine", value = "core.thrusters" }
[[expect]]
tick = 106
entity = "thrusters"
component = "part"
field = "fitted"
equals = false
[[expect]]
tick = 106
entity = "ship"
component = "pilot"
field = "chosen_part"
equals = "core.thrusters"

# The lens, chosen where it is fitted, then Take it off here: into the locker, the choice
# done and the sign worn again.
[[input]]
tick = 110
name = "core.choose"
source = "ui"
payload = { value = "core.lens" }
[[expect]]
tick = 111
entity = "ship"
component = "pilot"
field = "chosen_part"
equals = "core.lens"
[[expect]]
tick = 111
entity = "kiln_fitter"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 115
name = "core.unfit"
source = "ui"
payload = { value = "core.lens" }
[[expect]]
tick = 116
entity = "lens"
component = "part"
field = "fitted"
equals = false
[[expect]]
tick = 116
entity = "ship"
component = "pilot"
field = "chosen_part"
equals = ""
[[expect]]
tick = 116
entity = "kiln_fitter"
component = "engine.life"
field = "name"
equals = "Orrin Vale"

# Leaving the room lets a choice go.
[[input]]
tick = 120
name = "core.choose"
source = "ui"
payload = { value = "core.pods" }
[[expect]]
tick = 121
entity = "ship"
component = "pilot"
field = "chosen_part"
equals = "core.pods"
[[input]]
tick = 125
name = "core.close"
payload = { down = true }
[[expect]]
tick = 126
entity = "ship"
component = "pilot"
field = "chosen_part"
equals = ""

# Everything done in the station's rooms (the sale at the exchange, the fit and the
# removal at the cradle) is logged at the station, so it is one visit with its docking.
[[expect]]
tick = 140
entity = "log1"
component = "entry"
field = "at"
equals = "core.kiln"
[[expect]]
tick = 140
entity = "log2"
component = "entry"
field = "at"
equals = "core.kiln"
[[expect]]
tick = 140
entity = "log3"
component = "entry"
field = "at"
equals = "core.kiln"
[[expect]]
tick = 140
entity = "log4"
component = "entry"
field = "at"
equals = "core.kiln"

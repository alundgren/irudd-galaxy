# After the greenhouse, Cold Kettle's other answers (scripts/salvage.luau, scripts/tow.luau),
# from a finished greenhouse: Noor's ask answered Not now and asked again after a docking;
# the line slipped by a hand swing round the ice, passed again and cast off with 0; towed
# into Lantern Dock, Bram answered Not now (after his introduction, which comes first),
# and towed on to Cinder Kiln; Mags's offer comes on only once 12 ore is aboard; and
# Hessa's fee declined.
#
# Starts on Lantern Dock's berth with the galley one plate short, that plate aboard,
# credits for the shopping and the day as the trade route's trades leave it (set, not
# played through the trade route). From there it
# plays the greenhouse as greenhouse.toml does, with every trip set, not flown: the
# launch, what the hold carries after it, "away" where the trip was a visit, and the ship
# put on the next berth to dock (the glassite trip stops by the stone ring, so it wakes).
# The barge's trips are set too: the ship is put alongside her and passes the line by a
# script's order, and ship and barge are put by a berth, the line still fast, to dock.
# The slip is flown by hand from where a real tow leaves them, among the floes.

# Ines's greenhouse (scripts/project.luau), its choices: "Not now" leaves her ask for the
# next docking, even a quick tap; Sefa's glassite offer is on only with the 8 glassite
# aboard; the panes wait at the Kiln while the hold has no room for them; and once
# loaded they are Ines's, so the Lantern exchange won't buy them before she has them.
#
# Starts on Lantern Dock's berth with the galley one plate short, that plate aboard and
# credits for a ration (set, not played through the trade route): the sale builds it and
# her gift is taken. The trips between the talks are set, not flown: the launch, what
# the hold carries after it (3 glassite, then 8, then a hold of ore), "away" where the
# trip was a visit, and the ship put on the next berth to dock. The first glassite trip
# stops by the stone ring, so it wakes as it does in the drift. The quick tap after
# "Not now" is played as it is.

# The opening's pace, so a change that shrinks the reach, fills the hold faster or pays
# more shows here. A new game starts in the ore drift: a Mine order cuts the nearest rocks
# and the hold of 24 is full 27 seconds into the cutting, not sooner. Cinder Kiln
# is a real flight away: 19 seconds from the Dock order to its clamps, still out in
# the reach halfway there. The first hold sells for 379 cr; the cheapest part, the cutting
# lens at 3000 cr, is many holds away; and the two controls that fly for you wait on a
# hundred and two hundred full holds. README.md "The opening hour" has the whole table.
seed = 7
ticks = 1523

[[input]]
tick = 1
name = "core.ahead"
payload = { down = true }

[[input]]
tick = 11
name = "core.ahead"
payload = { down = false }

[[input]]
tick = 60
name = "core.mine"

[[input]]
tick = 886
name = "core.dock"
payload = { station = "core.kiln" }

[[input]]
tick = 1499
name = "core.open"

[[input]]
tick = 1509
name = "core.sell"

# Twenty seconds of cutting in, the hold is not yet full.
[[expect]]
tick = 660
entity = "ship"
component = "hold"
field = "ore"
at_most = 18

[[expect]]
tick = 660
facts = "core.hold_full"
equals = 0

# Full at the last unit.
[[expect]]
tick = 871
facts = "core.hold_full"
equals = 1

[[expect]]
tick = 871
entity = "ship"
component = "hold"
field = "ore"
equals = 24

# Halfway to the Kiln: still out in the reach.
[[expect]]
tick = 1170
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.reach"

[[expect]]
tick = 1453
facts = "core.docked"
equals = 0

# Clamped at the Kiln 568 ticks after the order.
[[expect]]
tick = 1454
facts = "core.docked"
equals = 1

# The first hold's pay, the lens far out of reach, and the controls' gates.
[[expect]]
tick = 1513
entity = "ship"
component = "pilot"
field = "credits"
equals = 379

[[expect]]
tick = 1513
entity = "lens"
component = "part"
field = "price"
equals = 3000

[[expect]]
tick = 1513
entity = "rig"
component = "part"
field = "holds"
equals = 100

[[expect]]
tick = 1513
entity = "jets"
component = "part"
field = "holds"
equals = 200

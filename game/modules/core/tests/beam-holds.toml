# A beam holds on its rock as the rock shrinks (cutter.holds). A scripted order flies the
# ship towards the south-east seam (rock5) and is cancelled short of it, so she coasts to
# a stop some 6.7 units off its surface, near the edge of the cutter's reach of 7, as a
# pilot stops who flies up until the hint says the rock is in reach. One click puts the
# beam on, no key is held, and it cuts the whole hold: the seam shrinks by a fifth as it
# is cut, and its surface drawing back past the cutter's reach no longer lifts the beam
# (it used to slip off at 15 of 24).
seed = 7
ticks = 1080

[[input]]
tick = 1
name = "core.mine"
payload = { rock = "core.rock5" }
[[input]]
tick = 103
name = "core.cancel"
payload = { down = true }
[[input]]
tick = 260
name = "core.mine"
source = "ui"
payload = { rock = "core.rock5" }
[[expect]]
tick = 259
entity = "ship"
component = "pilot"
field = "mining"
equals = false
[[expect]]
tick = 261
entity = "ship"
component = "pilot"
field = "mining"
equals = true
[[expect]]
tick = 261
entity = "ship"
component = "pilot"
field = "latched"
equals = true
[[expect]]
tick = 700
entity = "ship"
component = "pilot"
field = "mining"
equals = true
[[expect]]
tick = 700
entity = "ship"
component = "pilot"
field = "target"
equals = "core.rock5"
[[expect]]
tick = 900
entity = "ship"
component = "pilot"
field = "mining"
equals = true
[[expect]]
tick = 1060
entity = "ship"
component = "hold"
field = "ore"
equals = 24
[[expect]]
tick = 1060
entity = "ship"
component = "pilot"
field = "message"
equals = "Hold full: 24 ore aboard."

# Mining and docking by hand, with the keys a player presses. Space out of reach cuts
# nothing and says why. W flies up to the first rock; Space held puts the beam on it at
# once, a unit comes loose half a second in and one every second after, and the twelfth
# cuts it down to pebbles: the beam lets go. A short turn and nudge put the nose on the
# next rock, and its twelve fill the hold: the beam lets go with the hold's own beat.
# Turned round onto Lantern Dock, W held flies her the long way there; let go short of
# it, a touch of D puts the nose back on the berth, and a last press of W coasts the ship
# to a stop in the berth's ring, where the clamps take her in.
# hand-mining.inputs is the same route for a window (hand-mining.bot.toml).

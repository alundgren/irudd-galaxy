# Mining and docking by hand, with the keys a player presses. Space out of reach cuts
# nothing and says why. W flies up to the first rock; Space held puts the beam on it at
# once, the cold stone gives its first unit within two seconds and comes away faster as it
# warms, and the seventh cuts it down to pebbles: the beam lets go. A turn and a short run
# put the nose on the big seam to the east, whose soft stone cuts half again as fast and
# says so, along with the stone's heat; Space held on it the whole time, it glazes and
# the rest comes slowly (cutting.toml moves the beam instead), and it fills the hold: the
# beam lets go with the hold's own beat. Turned onto Lantern Dock, W held
# flies her there; let go short of it, a touch re-aims her, and a last press of W coasts
# the ship slowly into the berth's ring, where the clamps take her in.
# hand-mining.inputs is the same route for a window (hand-mining.bot.toml).

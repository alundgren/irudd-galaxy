# Mining and docking by hand, with the keys a player presses. Space out of reach cuts
# nothing and says why. W flies up to the first rock; Space held puts the beam on it at
# once, a unit comes loose half a second in and one every second after, and the seventh
# cuts it down to pebbles: the beam lets go. A turn and a short run put the nose on the
# big seam to the east, whose soft stone cuts half again as fast and says so, and it fills
# the hold: the beam lets go with the hold's own beat. Turned onto Lantern Dock, W held
# flies her there; let go short of it, a touch re-aims her, and a last press of W coasts
# the ship to a stop in the berth's ring, where the clamps take her in.
# hand-mining.inputs is the same route for a window (hand-mining.bot.toml).

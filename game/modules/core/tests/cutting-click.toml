# Cutting takes judgment by clicks alone (rules.HEAT), with no key pressed: parked as in
# cutting.toml between the south-east seam (rock5) and its spall (rock10), facing the
# spall. A click on the seam, in reach but off the nose, turns her onto it where she sits
# (the helm's own turn rate, no flying) until the nose settles on its centre, not at the
# edge of the aim (rules.SETTLE), and the beam latches on there. Once the seam has glazed,
# a click on the spall moves the beam there the same way, and a click back on the seam
# finishes the hold, 18 seconds from the first click. The ship never moves off her spot.
seed = 7
ticks = 730


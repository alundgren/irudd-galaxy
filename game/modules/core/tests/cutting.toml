# Cutting takes judgment (rules.HEAT). A scripted order flies the ship to the south-east
# seam's spall (rock10) and is cancelled as it gets there, parked between the spall and
# the seam (rock5); from there the pilot cuts by hand, with turns and clicks. The first
# hand beam brings Sefa's word on what to watch. The seam warms and cuts fast, then
# glazes (its look, the beam's and the line all say so); the pilot turns onto the spall
# and cuts that while the seam cools back to cold, then turns back to the seam and fills
# the hold: 17 seconds of cutting from the first click, against 26 for clicking the seam
# once and waiting (cutting-wait.toml).
seed = 7
ticks = 720

[[input]]
tick = 1
name = "core.mine"
payload = { rock = "core.rock10" }
[[input]]
tick = 146
name = "core.cancel"
payload = { down = true }

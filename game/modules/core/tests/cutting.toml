# Cutting takes judgment (rules.HEAT). A scripted order flies the ship to the east seam
# (rock5) and is cancelled as it gets there; then the pilot cuts by hand with clicks. The
# first hand beam brings Sefa's word on what to watch. The seam warms and cuts fast,
# then glazes (its look, the beam's and the line all say so); the pilot turns onto the
# seam's spall (rock10) and cuts that while the seam cools back to cold, then turns back
# to the seam and fills the hold: 18 seconds of cutting from the first click, against
# 26 for clicking the seam once and waiting (cutting-wait.toml).
seed = 7
ticks = 760


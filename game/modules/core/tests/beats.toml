# Both beats on one unit (scripts/main.luau, cut): Mine orders on rock4 (12 ore), then
# rock2 (6) and rock6 (6), so the 24th unit cuts rock6 down and fills the hold at once.
# The log keeps both, the rock's first and the full hold last, so the hold's is the
# message showing.
seed = 7
ticks = 962

[[input]]
tick = 1
name = "core.mine"
source = "script"
payload = { rock = "core.rock4" }

[[input]]
tick = 455
name = "core.mine"
source = "script"
payload = { rock = "core.rock2" }

[[input]]
tick = 695
name = "core.mine"
source = "script"
payload = { rock = "core.rock6" }

[[expect]]
tick = 961
facts = "core.hold_full"
equals = 1

[[expect]]
tick = 961
entity = "rock6"
component = "ore"
field = "left"
equals = 0

[[expect]]
tick = 961
entity = "log5"
component = "entry"
field = "text"
equals = "Rock cut down to pebbles. 8 more rocks hold ore."

[[expect]]
tick = 961
entity = "log6"
component = "entry"
field = "text"
equals = "Hold full: 24 ore aboard."

[[expect]]
tick = 961
entity = "ship"
component = "pilot"
field = "message"
equals = "Hold full: 24 ore aboard."

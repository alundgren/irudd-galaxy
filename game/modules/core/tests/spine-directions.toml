# Every way people tell before the chart glass is fitted, flown as said (direction doc 2.2:
# found by sight and by vague but correct directions, never by numbers or markers). Each
# leg starts the ship at rest where the line is said (the ore drift, or a station's
# berth) on the plain compass heading the words give, W held, and checks that the place
# named comes into the flight view on the way: the ship's position at its closest pass
# lies within the view's half-width (50) and half-height (28) of the place. The ore drift
# counts as in view anywhere over its rocks' spread, which reaches 92 west and 82 east of
# the drift's heart and 42 south and 34 north of it.
seed = 7
ticks = 3135

[[input]]
tick = 1
name = "core.ahead"
source = "keyboard"
payload = { down = true }


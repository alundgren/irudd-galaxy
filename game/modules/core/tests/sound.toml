# Sound cues (scripts/sound.luau): each real change records one cue event, never one
# for each press and release. Thrust starts once for a held W even when the key repeats,
# S pressed against the held W stops it and let go starts it again, and W let go stops
# it. Shift
# boosts once. The radio and the mine order click; each unit mined chips, the three
# chips taking turns; mining a full hold is refused, and the unit that fills it chimes.
# Docked, a movement key flying off cues once. A click on a screen button, and a room or
# the log opening and closing, cue nothing here: [ui] in audio.toml sounds them.
seed = 7
ticks = 760

[[input]]
tick = 1
name = "ahead"
payload = { down = true }
[[input]]
tick = 2
name = "ahead"
payload = { down = true }
[[input]]
tick = 5
name = "back"
payload = { down = true }
[[input]]

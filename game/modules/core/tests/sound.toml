# Tuning by key clicks; the same tune clicked on the radio's button records no click,
# since audio.toml's [ui] press sounds it on the frame. Then the mine order clicks.
[[expect]]
tick = 30
facts = "ui_click"
equals = 1
[[expect]]
tick = 60
facts = "ui_click"
equals = 2

# Six units fill the bare hull's hold, each with a chip, the three chips in turn, and
# the last one chimes.
[[expect]]
tick = 339
facts = "mined"
equals = 6
[[expect]]
tick = 339
facts = "chip1"
equals = 2
[[expect]]
tick = 339
facts = "chip2"
equals = 2
[[expect]]
tick = 339
facts = "chip3"
equals = 2
[[expect]]
tick = 339
facts = "hold_full"
equals = 1
[[expect]]
tick = 339
facts = "refused"
equals = 0
[[expect]]
tick = 345
facts = "refused"
equals = 1

# The dock order clicks; arriving clunks (the docked fact).
[[expect]]
tick = 599
facts = "ui_click"
equals = 3
[[expect]]
tick = 599
facts = "docked"
equals = 1

# Opening the exchange, Back and the log record no cue here: [ui] in audio.toml sounds a
# room's panel and the log as they open and close, by key or click.
[[expect]]
tick = 655
facts = "ui_click"
equals = 3

# W flies off the dock: one undock and one thrust; letting go stops it.
[[expect]]
tick = 705
facts = "undocked"
equals = 1
[[expect]]
tick = 705
facts = "thrust_on"
equals = 3
[[expect]]
facts = "thrust_off"
equals = 3

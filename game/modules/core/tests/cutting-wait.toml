# Click and wait (rules.HEAT): parked as in cutting.toml, one click on the seam (rock5) and
# no more. The seam warms and cuts fast, then glazes and the beam skates for the rest of
# the hold: still cutting, still filling it, 26 seconds from the click against 17 for
# moving the beam to the spall and back. Nothing is lost: the hold fills all the same,
# and the seam cools back to cold within a few seconds of the beam letting go.

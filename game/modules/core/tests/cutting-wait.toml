# Click and wait (rules.HEAT): the same seam as cutting.toml, one click and no more. The
# seam warms and cuts fast, then glazes and the beam skates for the rest of the hold:
# still cutting, still filling it, 26 seconds from the click against 18 for moving the
# beam to the spall and back. Nothing is lost: the hold fills all the same, and the seam
# cools back to cold within a few seconds of the beam letting go.
seed = 7
ticks = 1080

[[input]]
tick = 1
name = "core.mine"
payload = { rock = "core.rock5" }
[[input]]
tick = 150
name = "core.cancel"
payload = { down = true }

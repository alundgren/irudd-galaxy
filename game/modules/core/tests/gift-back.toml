# Going back mid-talk: Back from a room ends the bubble there, so it never rides the
# cut out. Ines's offer,
# left unanswered, stays on offer and begins again at its first line; Back on that
# first, ordinary line ends it too; the third time the gift is taken, and the log keeps
# the one conversation once. Inside a room the log stays shut, so it ends no bubble.
# An offer heard and left unanswered (Back on it) is marked heard, and stays so through
# a launch and redock, so the log keeps it pinned once newer entries push its
# conversation out of the 60 kept (tests/log.luau checks the pin itself).
#
# Starts on Lantern Dock's berth with the galley one plate short, that plate aboard and
# credits for a hold of rations (set, not played through the trade route); the sale in
# the exchange builds the galley, and her room is opened.

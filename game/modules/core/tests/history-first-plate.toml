# Shared history: Ines met only after the first plate (scripts/voices.luau,
# history.luau). She is never clicked at the bare site: 13 plate go into the galley, and
# the player comes back to the site and clicks her for the first time. She starts with
# her word on the first plate, then her introduction, and once heard there her everyday
# line doesn't say it again.
#
# Starts on Lantern Dock's berth with 13 plate aboard (set, not mined and bought); the
# site is visited once without a word, the plate is sold, and after a quick launch and
# redock the player comes back to the site.
seed = 7
ticks = 130

[[edit]]
entity = "ship"
component = "engine.position"
set = { x = -184, y = -203, angle = -2.601173153319209 }
[[edit]]
entity = "ship"
component = "hold"
set = { plate = 13 }

[[input]]
tick = 1
name = "core.dock"
payload = { station = "core.lantern" }
[[input]]
tick = 10
name = "core.open"
payload = { facility = "core.lantern_galley" }
[[input]]
tick = 13
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_galley_room", start_tick = 10 }
[[input]]
tick = 40
name = "core.close"
[[input]]
tick = 50
name = "core.open"
[[input]]
tick = 60
name = "core.sell"
[[input]]
tick = 70
name = "core.launch"
[[input]]
tick = 75
name = "core.dock"
payload = { station = "core.lantern" }
[[input]]
tick = 110
name = "core.open"
payload = { facility = "core.lantern_galley" }
[[input]]
tick = 113
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_galley_room", start_tick = 110 }

# Her word on the first plate leads her introduction, still unheard.
[[expect]]
tick = 121
entity = "lantern_cook_intro"
component = "engine.talk"
field = "first"
equals = "core.lantern_cook_intro_news"
[[expect]]
tick = 121
entity = "lantern_cook_intro_news"
component = "engine.talk_line"
field = "text"
equals = "That's the first of it! I can almost hear the stove."
[[input]]
tick = 122
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_cook_intro" }
[[expect]]
tick = 122
entity = "lantern_cook_intro"
component = "engine.talk"
field = "current"
equals = "core.lantern_cook_intro_news"
[[input]]
tick = 123
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_intro", line = "core.lantern_cook_intro_news" }
[[input]]
tick = 124
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_intro", line = "core.lantern_cook_intro1" }
[[input]]
tick = 125
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_intro", line = "core.lantern_cook_intro2" }
[[input]]
tick = 126
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_intro", line = "core.lantern_cook_intro3" }

# Her whole introduction kept, and her word said once: her everyday line counts on alone.
[[expect]]
tick = 128
entity = "lantern_cook_intro"
component = "engine.talk"
field = "seen"
equals = true
[[expect]]
tick = 128
entity = "lantern_cook_intro1"
component = "engine.talk_line"
field = "text"
equals = "I'm Ines. This scaffold is going to be my galley."
[[expect]]
tick = 128
entity = "lantern_galley"
component = "build"
field = "first_due"
equals = false
[[expect]]
tick = 128
entity = "lantern_cook_now"
component = "engine.talk_line"
field = "text"
equals = "27 plate to go, and the crews eat hot."

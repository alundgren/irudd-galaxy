# A beam holds on a glassite crystal as it shrinks (cutter.holds). A scripted order flies
# the ship out to the glassite drift and is cancelled short of the first crystal
# (glassite1), so she coasts to a stop some 6.9 units off it, near the edge of the
# cutter's reach. One click puts the beam on, no key is held, and it cuts the crystal down
# to pebbles: its shrinking never lifts the beam (it used to slip off at 2 of 8).
seed = 7
ticks = 1220

[[input]]
tick = 1
name = "core.mine"
payload = { rock = "core.glassite1" }
[[input]]
tick = 616
name = "core.cancel"
payload = { down = true }
[[input]]
tick = 760
name = "core.mine"
source = "ui"
payload = { rock = "core.glassite1" }
[[expect]]
tick = 761
entity = "ship"
component = "pilot"
field = "mining"
equals = true
[[expect]]
tick = 761
entity = "ship"
component = "pilot"
field = "target"
equals = "core.glassite1"
[[expect]]
tick = 900
entity = "ship"
component = "pilot"
field = "mining"
equals = true
[[expect]]
tick = 1100
entity = "ship"
component = "pilot"
field = "mining"
equals = true
[[expect]]
tick = 1200
entity = "glassite1"
component = "ore"
field = "left"
equals = 0
[[expect]]
tick = 1200
entity = "ship"
component = "hold"
field = "glassite"
equals = 8

# The galley is lived in before Ines asks for more (scripts/station.luau, project.luau).
# The sale that builds it seats two crews at her table, eating, and her thanks begin with
# what the player made happen. Once her gift is answered she doesn't ask for the
# greenhouse on that first visit: she says to come by again, and Bram doesn't send the
# player to her yet. Stepping out and straight back in doesn't count; once the player
# has flown out and docked again, a counted visit, she asks.
#
# Starts on Lantern Dock's berth with the galley one plate short and that plate aboard,
# Lantern Dock visited twice before and the field as the trade route's mining and
# regrowth leave it (all set, not played). The sale in the exchange builds the galley;
# the flight out and back at the end is real, as the visit it counts is the point.
seed = 7
ticks = 240

[[edit]]
entity = "ship"
component = "engine.position"
set = { x = -184, y = -203, angle = -2.601173153319209 }
[[edit]]
entity = "ship"
component = "hold"
set = { plate = 1 }
[[edit]]
entity = "lantern_galley"
component = "build"
set = { given = 39 }
[[edit]]
entity = "lantern"
component = "port"
set = { visits = 2 }
[[edit]]
entity = "rock1"
component = "ore"
set = { left = 3 }
[[edit]]

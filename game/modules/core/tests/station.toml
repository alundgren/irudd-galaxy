# Docked at Lantern Dock with a full hold: the station's buildings are the menu.
# Open the office from its sign, switch straight to the exchange with M, try the
# refused actions, talk to the keeper, sell (the ore pile on the deck grows with the
# stock), go back, use the log and launch.
seed = 3
ticks = 406

# Starts just off Lantern Dock's berth with a full hold of ore, docking.
[[edit]]
entity = "ship"
component = "hold"
set = { ore = 24 }
[[edit]]
entity = "ship"
component = "engine.position"
set = { x = -178, y = -197 }
[[input]]
tick = 1
name = "core.dock"
source = "script"
payload = { station = "core.lantern" }

# The arrival cut lands, as a window's play records it.
[[input]]
tick = 96
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 40 }

# The office opens from its sign; selling there is refused.
[[input]]
tick = 246
name = "core.open"
payload = { facility = "core.lantern_office" }
[[input]]
tick = 251
name = "core.sell"
[[expect]]
tick = 252
entity = "ship"
component = "pilot"
field = "room"
equals = "core.lantern_office"
[[expect]]
tick = 252
entity = "ship"
component = "hold"
field = "ore"
equals = 24

# Another station's building can't be opened from here.
[[input]]
tick = 256
name = "core.open"
payload = { facility = "core.kiln_exchange" }
[[expect]]
tick = 257
entity = "ship"
component = "pilot"
field = "room"
equals = "core.lantern_office"

# The log stays shut while a room has the focus.
[[input]]
tick = 258
name = "core.log"
[[expect]]
tick = 259
entity = "ship"
component = "pilot"
field = "log_open"
equals = false

# M opens the exchange directly from the office.
[[input]]
tick = 261
name = "core.open"
payload = { down = true }
[[expect]]
tick = 262
entity = "ship"
component = "pilot"
field = "room"
equals = "core.lantern_exchange"

# The cut lands, and the keeper speaks when clicked.
[[input]]
tick = 264
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_exchange_room", start_tick = 261 }
[[input]]
tick = 266
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_intro" }
[[expect]]
tick = 267
entity = "lantern_trader_intro"
component = "engine.talk"
field = "active"
equals = true

[[input]]
tick = 276
name = "core.sell"
[[input]]
tick = 277
name = "core.sell"
[[expect]]
tick = 278
entity = "ship"
component = "pilot"
field = "credits"
equals = 379
[[expect]]
tick = 278
entity = "ship"
component = "pilot"
field = "sale"
equals = 379
[[expect]]
tick = 278
entity = "lantern_ore"
component = "market"
field = "stock"
equals = 74
[[expect]]
tick = 278
entity = "lantern_stock"
component = "engine.model"
field = "scale"
equals = 1.08
[[expect]]
tick = 278
entity = "log1"
component = "entry"
field = "text"
equals = "Docked at Lantern Dock."
[[expect]]
tick = 278
entity = "log2"
component = "entry"
field = "text"
equals = "Sold 24 ore to Lantern Dock for 379 cr."

# Back to the whole station, then the log opens and closes.
[[input]]
tick = 286
name = "core.close"
[[input]]
tick = 291
name = "core.log"
[[expect]]
tick = 292
entity = "ship"
component = "pilot"
field = "log_open"
equals = true

# Opening a room closes the log.
[[input]]
tick = 296
name = "core.open"
payload = { facility = "core.lantern_office" }
[[expect]]
tick = 297
entity = "ship"
component = "pilot"
field = "log_open"
equals = false

# The skiff keeps ferrying across the deck while the player is docked.
[[expect]]
tick = 346
entity = "lantern_skiff"
component = "engine.walk"
field = "active"
equals = true

[[input]]
tick = 366
name = "core.launch"
[[expect]]
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.reach"
[[expect]]
entity = "ship"
component = "engine.model"
field = "scale"
equals = 1
[[expect]]
facts = "sold"
equals = 1

# Ines's word on the first plate is heard, whichever way the player meets it
# (scripts/station.luau, voices.luau, talk.luau). The sale's log entry has it, but a
# player who goes to the site and clicks her heard only the plate still to come ("27
# plate to go"). Now her everyday line leads with it until it is heard, then counts on
# alone.
#
# Starts on Lantern Dock's berth with 13 plate aboard (set, not mined and bought): she is
# met at the bare site, the 13 plate are sold into the galley, and after a quick launch
# and redock the player comes back to the site and clicks her.
seed = 7
ticks = 135

[[edit]]
entity = "ship"
component = "engine.position"
set = { x = -184, y = -203, angle = -2.601173153319209 }
[[edit]]
entity = "ship"
component = "hold"
set = { plate = 13 }


# The radio tunes itself without flickering. A new game finds Lantern Dock's channel
# in its first second and starts its music once. Mining a whole hold at the first rocks,
# the radio keeps Lantern Dock: no second cue, no switch. On the long flight out to
# Cinder Kiln its channel takes over once, when it has been clearly stronger for a few
# seconds. Docking there stops the music; flying off tunes straight back to the Kiln's
# own channel with one cue, its signal Strong. Flying back across to Lantern Dock, the
# Kiln's channel holds over the field and Lantern Dock's takes over once, on the way in.
# The order is cancelled short of the berth's ring, where the clamps would take her in,
# and the ship coasts to a stop about 15 units off the berth.
seed = 7
ticks = 2840

[[input]]
tick = 90
name = "mine"
payload = { down = true }

[[input]]
tick = 1230
name = "dock"
payload = { station = "core.kiln" }

[[input]]
tick = 2040
name = "ahead"
payload = { down = true }

[[input]]
tick = 2041
name = "ahead"
payload = { down = false }

[[input]]
tick = 2100
name = "dock"
payload = { station = "core.lantern" }

[[input]]
tick = 2655
name = "cancel"
payload = { down = true }

# The first second out, far out at the field: Lantern Dock, Fair, its music cued once.
[[expect]]
tick = 61
entity = "ship"
component = "radio"
field = "channel"
equals = "core.lantern_radio"

[[expect]]
tick = 61
entity = "ship"
component = "radio"
field = "level"
equals = 2

[[expect]]
tick = 61
facts = "radio_lantern"
equals = 1

# A whole hold mined at the first rocks: still Lantern Dock, cued once, and the Kiln
# never cued.
[[expect]]
tick = 1220
entity = "ship"
component = "hold"
field = "ore"
equals = 24

[[expect]]
tick = 1220
entity = "ship"
component = "radio"
field = "channel"
equals = "core.lantern_radio"

[[expect]]
tick = 1220
facts = "radio_lantern"
equals = 1

[[expect]]
tick = 1220
facts = "radio_kiln"
equals = 0

# Docked at Cinder Kiln, the music stops once.
[[expect]]
tick = 2020
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.kiln"

[[expect]]
tick = 2020
facts = "radio_off"
equals = 1

# Flown off at the Kiln: straight to its channel, cued once more, Strong.
[[expect]]
tick = 2099
entity = "ship"
component = "radio"
field = "channel"
equals = "core.kiln_radio"

[[expect]]
tick = 2099
entity = "ship"
component = "radio"
field = "level"
equals = 3

[[expect]]
tick = 2099
facts = "radio_kiln"
equals = 2

[[expect]]
tick = 2099
facts = "radio_lantern"
equals = 1

# Stopped by Lantern Dock's berth: Lantern Dock took over once, Strong.
[[expect]]
tick = 2839
entity = "ship"
component = "radio"
field = "channel"
equals = "core.lantern_radio"

[[expect]]
tick = 2839
facts = "radio_lantern"
equals = 2

[[expect]]
tick = 2839
facts = "radio_kiln"
equals = 2

[[expect]]
tick = 2839
entity = "ship"
component = "radio"
field = "level"
equals = 3

[[expect]]
tick = 2839
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.reach"

# Ines's introduction left midway (scripts/talk.luau, scripts/station.luau): she is met
# at the bare galley site and her first line is heard, then the player leaves without
# the rest. Once the galley stands, a click on her picks up at the first line not yet
# heard, said the built way (build.met), and "I'm Ines" is not said again: the log holds
# it once. The review's reproduction.
#
# Starts on Lantern Dock's berth with 13 plate aboard (set, not mined and bought). Her
# first line is heard, the 13 plate are sold into the galley (her word on it goes into
# her unheard introduction), then the galley is set one plate short with that plate
# aboard, and its last plate is sold.
seed = 7
ticks = 95

[[edit]]
entity = "ship"
component = "engine.position"
set = { x = -184, y = -203, angle = -2.601173153319209 }
[[edit]]
entity = "ship"
component = "hold"
set = { plate = 13 }

[[input]]
tick = 1
name = "core.dock"
payload = { station = "core.lantern" }
[[input]]
tick = 10
name = "core.open"
payload = { facility = "core.lantern_galley" }
[[input]]
tick = 13
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_galley_room", start_tick = 10 }
[[input]]
tick = 20
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_cook_intro" }
[[input]]
tick = 21
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_intro", line = "core.lantern_cook_intro1" }

# Left after the first line: the next click starts at the second.
[[expect]]
tick = 27
entity = "lantern_cook_intro"
component = "engine.talk"
field = "first"
equals = "core.lantern_cook_intro2"

[[expect]]
tick = 27
entity = "lantern_cook_intro"
component = "engine.talk"
field = "seen"
equals = false

# Her first line, heard at the site.
[[expect]]
tick = 27
entity = "log3"
component = "entry"
field = "text"
equals = "Ines Varga at Lantern Dock: “I'm Ines. This scaffold is going to be my galley.”"

[[input]]
tick = 40
name = "core.close"
[[input]]
tick = 50
name = "core.open"
[[input]]
tick = 60
name = "core.sell"

# One plate short, with it aboard: the sale builds the galley.
[[edit]]
tick = 65
entity = "lantern_galley"
component = "build"
set = { given = 39 }
[[edit]]
tick = 65
entity = "ship"
component = "hold"
set = { plate = 1 }
[[input]]
tick = 70
name = "core.sell"
[[input]]
tick = 75
name = "core.open"
payload = { facility = "core.lantern_galley" }
[[input]]
tick = 78
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_galley_room", start_tick = 75 }
[[input]]
tick = 86
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_cook_intro" }

# Back once the galley stands: she goes on from there.
[[expect]]
tick = 87
entity = "lantern_cook_intro"
component = "engine.talk"
field = "current"
equals = "core.lantern_cook_intro2"

# What was heard stays as it was heard.
[[expect]]
tick = 87
entity = "lantern_cook_intro1"
component = "engine.talk_line"
field = "text"
equals = "I'm Ines. This scaffold is going to be my galley."

# The rest is said the built way.
[[expect]]
tick = 87
entity = "lantern_cook_intro2"
component = "engine.talk_line"
field = "text"
equals = "The crews ate cold tins between shifts. Now they sit down to a hot meal."

[[expect]]
tick = 87
entity = "lantern_cook_intro3"
component = "engine.talk_line"
field = "text"
equals = "I cook rations for them, and Cinder Kiln pays well for them too."

[[input]]
tick = 88
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_intro", line = "core.lantern_cook_intro2" }
[[input]]
tick = 89
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_cook_intro", line = "core.lantern_cook_intro3" }

# The same entry goes on with the rest, said the built way: "I'm Ines" is in it once.
[[expect]]
tick = 94
entity = "log3"
component = "entry"
field = "text"
equals = "Ines Varga at Lantern Dock: “I'm Ines. This scaffold is going to be my galley.” “The crews ate cold tins between shifts. Now they sit down to a hot meal.” “I cook rations for them, and Cinder Kiln pays well for them too.”"

[[expect]]
tick = 94
entity = "lantern_cook_intro"
component = "engine.talk"
field = "seen"
equals = true

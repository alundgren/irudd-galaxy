# A repeat loop. Each worked-out rock and then the full hold are beats in the log; a
# counted docking at Lantern Dock regrows a worked-out rock to half its stone, rounded
# down (rock1's seven: three), and the regrown stone mines again; the second hold sells
# for less than the first, as the exchange's stock rises.
#
# Starts as a new game with 22 ore aboard, rock1 down to its last unit and two other
# rocks already worked out, so the next units cut rock1 down and fill the hold. Then the
# first sale is set (379 credits, Lantern Dock's ore stock 74, rock1 worked out) and the
# ship flies in from just off Lantern Dock's berth after a trip out.
seed = 1
ticks = 460
[[edit]]
entity = "ship"
component = "hold"
set = { ore = 22 }
[[edit]]
entity = "rock1"
component = "ore"
set = { left = 1 }
[[edit]]
entity = "rock2"
component = "ore"
set = { left = 0 }
[[edit]]
entity = "rock3"
component = "ore"
set = { left = 0 }
[[input]]
tick = 1
name = "core.ahead"
payload = { down = true }
[[input]]
tick = 11
name = "core.ahead"
payload = { down = false }
[[input]]
tick = 60
name = "core.mine"

# The units cut rock1 down, then fill the hold: the log keeps the rock's beat, then the
# full hold (beats.toml has both beats on one unit).
[[expect]]
tick = 200
entity = "ship"
component = "hold"
field = "ore"
equals = 24
[[expect]]
tick = 200
entity = "ship"
component = "pilot"
field = "message"
equals = "Hold full: 24 ore aboard."
[[expect]]
tick = 200
entity = "log1"
component = "entry"
field = "text"
equals = "Rock cut down to pebbles. 8 more rocks hold ore."
[[expect]]
tick = 200
entity = "log2"
component = "entry"
field = "text"
equals = "Hold full: 24 ore aboard."

# The first hold sold at Lantern Dock and the second cut, rock1 worked out again: the
# ship comes in from a trip out, so the docking counts.
[[edit]]
tick = 200
entity = "ship"
component = "pilot"
set = { credits = 379, last_dock = "core.lantern", away = true, cleared = true }
[[edit]]
tick = 200
entity = "lantern_ore"
component = "market"
set = { stock = 74 }
[[edit]]
tick = 200
entity = "rock1"
component = "ore"
set = { left = 0 }
[[edit]]
tick = 200
entity = "ship"
component = "engine.position"
set = { x = -178, y = -197 }
[[edit]]
tick = 200
entity = "ship"
component = "engine.motion"
set = { vx = 0.0, vy = 0.0 }
[[input]]
tick = 201
name = "core.dock"
source = "script"
payload = { station = "core.lantern" }
[[expect]]
tick = 260
facts = "core.docked"
equals = 1

# Docking brought fresh stone into rock1, half its seven, rounded down; the second hold
# sells for less than the first.
[[expect]]
tick = 260
entity = "rock1"
component = "ore"
field = "left"
equals = 3
[[input]]
tick = 260
name = "core.open"
[[input]]
tick = 270
name = "core.sell"
[[input]]
tick = 271
name = "core.sell"
[[expect]]
tick = 280
entity = "ship"
component = "pilot"
field = "credits"
equals = 720
[[expect]]
tick = 280
entity = "lantern_ore"
component = "market"
field = "stock"
equals = 86
[[expect]]
tick = 280
facts = "sold"
equals = 1

# Back out at the start with 21 aboard, rock1's regrown stone fills the hold.
[[input]]
tick = 280
name = "core.launch"
[[edit]]
tick = 290
entity = "ship"
component = "engine.position"
set = { x = 0, y = 0, angle = 0.0 }
[[edit]]
tick = 290
entity = "ship"
component = "engine.motion"
set = { vx = 0.0, vy = 0.0 }
[[edit]]
tick = 290
entity = "ship"
component = "hold"
set = { ore = 21 }
[[input]]
tick = 291
name = "core.ahead"
payload = { down = true }
[[input]]
tick = 301
name = "core.ahead"
payload = { down = false }
[[input]]
tick = 350
name = "core.mine"
[[expect]]
tick = 460
entity = "rock1"
component = "ore"
field = "left"
equals = 0
[[expect]]
tick = 460
entity = "ship"
component = "hold"
field = "ore"
equals = 24
[[expect]]
tick = 460
facts = "sold"
equals = 1

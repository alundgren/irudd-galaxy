# Shared history: keepers met only after the galley is built through Tova's exchange
# (scripts/voices.luau, history.luau). Never talked to before, Tova stays in her exchange
# after the sale that completes the galley and is clicked for the first time: she starts
# with the galley the player's plate built, then her introduction, and once heard there
# her everyday line is her own again. Then Bram is first met in the office, before any
# other trade or docking: who built it is his news, said first in place of his greeting,
# and his introduction ends on the galley being open, not on raising it.
#
# Starts on Lantern Dock's berth with the galley one plate short and that plate aboard
# (set, not played through the trade route); the sale in Tova's exchange builds it.
seed = 7
ticks = 190

[[edit]]
entity = "ship"
component = "engine.position"
set = { x = -184, y = -203, angle = -2.601173153319209 }
[[edit]]
entity = "ship"
component = "hold"
set = { plate = 1 }
[[edit]]
entity = "lantern_galley"
component = "build"
set = { given = 39 }

[[input]]
tick = 1
name = "core.dock"
payload = { station = "core.lantern" }
[[input]]
tick = 8
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 2 }
[[input]]
tick = 15
name = "core.open"
[[input]]
tick = 18
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_exchange_room", start_tick = 15 }
[[input]]
tick = 25
name = "core.sell"

# She has walked back to her counter; her first click comes long after the sale.
[[expect]]
tick = 129
entity = "lantern_trader_intro"
component = "engine.talk"
field = "first"
equals = "core.lantern_trader_intro_news"
[[expect]]
tick = 129
entity = "lantern_trader_intro_news"
component = "engine.talk_line"
field = "text"
equals = "Your plate built Ines's galley. I eat there every shift."
[[input]]
tick = 130
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_intro" }
[[expect]]
tick = 130
entity = "lantern_trader_intro"
component = "engine.talk"
field = "current"
equals = "core.lantern_trader_intro_news"
[[input]]
tick = 131
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro_news" }
[[input]]
tick = 132
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro1" }
[[input]]
tick = 133
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro2" }
[[input]]
tick = 134
name = "engine.talk_next"
source = "ui"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro3" }
# Her whole introduction kept, and the galley said once.
[[expect]]
tick = 136
entity = "lantern_trader_intro"
component = "engine.talk"
field = "seen"
equals = true
[[expect]]
tick = 136
entity = "lantern_trader_intro1"
component = "engine.talk_line"
field = "text"
equals = "I'm Tova, and I run the exchange."
[[expect]]
tick = 136
entity = "lantern_trader_now"
component = "engine.talk_line"
field = "text"
equals = "Empty hold? The ore floats north-east of us."

# Bram in his office, met for the first time just after the galley was finished.
[[input]]
tick = 140
name = "core.open"
payload = { facility = "core.lantern_office" }
[[input]]
tick = 150
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_office_room", start_tick = 140 }
[[input]]
tick = 160
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_master_intro" }
[[expect]]
tick = 160
entity = "lantern_master_intro"
component = "engine.talk"
field = "current"
equals = "core.lantern_master_intro_news"
[[expect]]
tick = 160
entity = "lantern_master_intro_news"
component = "engine.talk_line"
field = "text"
equals = "Your plate built our galley."
[[input]]
tick = 165
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro_news" }
[[input]]
tick = 170
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro2" }
[[input]]
tick = 175
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro3" }
[[input]]
tick = 180
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro4" }
# The greeting gave way to the news, and the introduction ends on the galley being open.
[[expect]]
tick = 190
entity = "lantern_galley"
component = "build"
field = "done"
equals = true
[[expect]]
tick = 190
entity = "lantern_master_intro"
component = "engine.talk"
field = "current"
equals = "core.lantern_master_intro5"
[[expect]]
tick = 190
entity = "lantern_master_intro5"
component = "engine.talk_line"
field = "text"
equals = "Our galley's open now. Go and eat."

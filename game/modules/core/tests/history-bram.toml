# Shared history (scripts/history.luau): Bram after the keep choice, with his
# introduction never heard: Cold Kettle is kept for good with his office's gold button.
# Clicked now, he starts with the barge off his berth, not with "Welcome to Lantern
# Dock", and the rest of his introduction follows from there. The office shows the
# choice too: Bram gets up from his desk and goes to the porthole to look out at her,
# and the porthole stays in his day.
#
# Starts on Lantern Dock's berth with the galley one plate short, that plate aboard,
# credits for the shopping and the day as the trade route's trades leave it (set, not
# played through the trade route). From there it
# plays the greenhouse as greenhouse.toml does, with every trip set, not flown: the
# launch, what the hold carries after it, "away" where the trip was a visit, and the ship
# put on the next berth to dock (the glassite trip stops by the stone ring, so it wakes).
# Then Noor's ask is accepted, and the barge's trips are set too: the ship is put alongside
# her and passes the line by a script's order, then ship and barge are put by Lantern
# Dock's berth, the line still fast, and the ship docks.

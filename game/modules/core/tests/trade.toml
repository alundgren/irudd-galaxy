# Docked at the Kiln with a full hold of ore: buying plate is refused.
[[expect]]
tick = 606
entity = "ship"
component = "hold"
field = "plate"
equals = 0
[[expect]]
tick = 606
entity = "ship"
component = "hold"
field = "ore"
equals = 6

# Six ore sell unit by unit as the Kiln's stock fills.

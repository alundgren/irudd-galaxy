# The trade loop end to end: mine and sell ore at Cinder Kiln, carry plate to Lantern
# Dock until its galley is built, then carry the galley's rations back to the Kiln.
# Along the way: buying rests while the hold is full, prices walk with each unit,
# a quick undock-and-redock tap is not a visit, and a site trades nothing until built.
# tests/trade.inputs holds the same route for sim runs and shots.

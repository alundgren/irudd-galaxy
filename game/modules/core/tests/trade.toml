# The trade loop: sell ore and buy plate at Cinder Kiln, carry plate to Lantern Dock
# until its galley is built, then carry the galley's rations back to the Kiln. Along the
# way: buying rests while the hold is full, prices walk with each unit, a quick
# undock-and-redock tap is not a visit, a site trades nothing until built, and the Kiln's
# plate stock eases back on each counted docking.
#
# Starts beside Cinder Kiln's berth with a hold of ore. Each trip between the stations is
# a launch and a jump to just off the next berth, and the plate runs between the first
# two and the last are set: 28 plate given, 17 aboard, and the stocks and visit counts
# as the route there leaves them.
seed = 7
ticks = 580
[[edit]]
entity = "ship"
component = "hold"
set = { ore = 24 }
[[edit]]
entity = "ship"
component = "engine.position"
set = { x = 200, y = -249 }
[[input]]
tick = 1
name = "core.dock"
source = "script"
payload = { station = "core.kiln" }
[[expect]]
tick = 50
facts = "core.docked"
equals = 1

# Docked at the Kiln with a full hold of ore: buying plate is refused.
[[input]]
tick = 50
name = "core.open"
[[input]]
tick = 55
name = "core.buy"
payload = { ware = "plate", units = 0 }
[[expect]]
tick = 56
entity = "ship"
component = "hold"
field = "plate"
equals = 0
[[expect]]
tick = 56
entity = "ship"
component = "hold"
field = "ore"
equals = 24


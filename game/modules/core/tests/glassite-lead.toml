# The first strand of the rumour web (scripts/rumour.luau), end to end: Ines's ask
# accepted, then to Cinder Kiln, where Sefa, met, says where the glassite grows (north of
# the berth, a lone buoy, lilac rocks). From her berth the ship flies north to the drift
# on a scripted Mine of glassite1, and the old stone ring there wakes as it comes in
# sight: 25.8 seconds of flight from launching after her lead. Back at the Kiln, she
# takes the glassite for Ines's panes, then asks what the player saw; told, she half
# answers and leaves the rest open. Mags, met after, has heard of it from her.
#
# Starts on Lantern Dock's berth with the galley one plate short, that plate aboard,
# credits for a ration and the field as the trade route's mining and regrowth leave it
# (set, not played): the sale builds the galley and her gift is taken. The trips to the
# talks are set, not flown (the launch, "away" for the counted docking her ask waits
# for, the ship put on the next berth), except the flight to the ring, whose time is the
# check: it is flown as it was. Once the ring wakes, the glassite she wants is set aboard
# and the ship is put back on the Kiln's berth.

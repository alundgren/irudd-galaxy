# Rooms cut and go back: a click on a building cuts into its room, a place of its own;
# Esc, right-click or B cuts back out to the station; Esc also shuts the log. Each keeper
# wears a name sign in their own room, none while the view moves or on the deck, and
# while someone speaks only the speaker keeps theirs. Launching from a room flies off.
# Play records engine.place_arrived when a cut or glide lands; here it is given by hand.
seed = 3
ticks = 346

# Starts just off Lantern Dock's berth with a full hold of ore, docking.
[[edit]]
entity = "ship"
component = "hold"
set = { ore = 24 }
[[edit]]
entity = "ship"
component = "engine.position"
set = { x = -178, y = -197 }
[[input]]
tick = 1
name = "core.dock"
source = "script"
payload = { station = "core.lantern" }

# Arriving glides in: no signs until it lands.
[[expect]]
tick = 66
entity = "ship"
component = "pilot"
field = "gliding"
equals = true
[[expect]]
tick = 66
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 96
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 40 }
[[expect]]
tick = 96
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[expect]]
tick = 96
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"

# A click on the exchange building cuts into its room, where Tova stands.
[[input]]
tick = 146
name = "core.open"
source = "ui"
payload = { facility = "core.lantern_exchange" }
[[expect]]
tick = 146
entity = "ship"
component = "pilot"
field = "room"
equals = "core.lantern_exchange"
[[expect]]
tick = 146
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern_exchange_room"
[[expect]]
tick = 146
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 176
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_exchange_room", start_tick = 146 }
[[expect]]
tick = 176
entity = "ship"
component = "pilot"
field = "gliding"
equals = false
[[expect]]
tick = 176
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = "Tova Reyes"
[[expect]]
tick = 176
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = ""

# Esc cuts back out to the whole station; letting go of it does nothing more.
[[input]]
tick = 186
name = "core.close"
source = "keyboard"
payload = { down = true }
[[input]]
tick = 187
name = "core.close"
source = "keyboard"
payload = { down = false }
[[expect]]
tick = 187
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"
[[expect]]
tick = 187
entity = "ship"
component = "pilot"
field = "gliding"
equals = true
[[input]]
tick = 216
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 186 }
[[expect]]
tick = 216
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = ""
[[expect]]
tick = 216
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""


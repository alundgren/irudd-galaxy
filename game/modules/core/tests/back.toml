equals = "core.lantern_office_room"
[[input]]
tick = 231
name = "core.close"
source = "mouse"
payload = { down = true }
[[expect]]
tick = 231
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"
[[input]]
tick = 261
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 231 }


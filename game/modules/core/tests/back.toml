# Rooms cut and go back: a click on a building cuts into its room, a place of its own;
# Esc, right-click or B cuts back out to the station; Esc also shuts the log. Each keeper
# wears a name sign in their own room, none while the view moves or on the deck, and
# while someone speaks only the speaker keeps theirs. Launching from a room flies off.
# Play records engine.place_arrived when a cut or glide lands; here it is given by hand.
seed = 3
ticks = 1954

[[input]]
tick = 1
name = "core.ahead"
payload = { down = true }
[[input]]
tick = 11
name = "core.ahead"
payload = { down = false }
[[input]]
tick = 60
name = "core.mine"
[[input]]
tick = 900
name = "core.dock"
payload = { station = "core.lantern" }

# Arriving glides in: no signs until it lands.
[[expect]]
tick = 1674
entity = "ship"
component = "pilot"
field = "gliding"
equals = true
[[expect]]
tick = 1674
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 1704
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 1650 }
[[expect]]
tick = 1704
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[expect]]
tick = 1704
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"

# A click on the exchange building cuts into its room, where Tova stands.
[[input]]
tick = 1754
name = "core.open"
source = "ui"
payload = { facility = "core.lantern_exchange" }
[[expect]]
tick = 1754
entity = "ship"
component = "pilot"
field = "room"
equals = "core.lantern_exchange"
[[expect]]
tick = 1754
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern_exchange_room"
[[expect]]
tick = 1754
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 1784
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_exchange_room", start_tick = 1754 }
[[expect]]
tick = 1784
entity = "ship"
component = "pilot"
field = "gliding"
equals = false
[[expect]]
tick = 1784
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = "Tova Reyes"
[[expect]]
tick = 1784
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = ""

# Esc cuts back out to the whole station; letting go of it does nothing more.
[[input]]
tick = 1794
name = "core.close"
source = "keyboard"
payload = { down = true }
[[input]]
tick = 1795
name = "core.close"
source = "keyboard"
payload = { down = false }
[[expect]]
tick = 1795
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"
[[expect]]
tick = 1795
entity = "ship"
component = "pilot"
field = "gliding"
equals = true
[[input]]
tick = 1824
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 1794 }
[[expect]]
tick = 1824
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = ""
[[expect]]
tick = 1824
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""

# The office from its building, then straight back with a right-click mid-cut.
[[input]]
tick = 1834
name = "core.open"
source = "ui"
payload = { facility = "core.lantern_office" }
[[expect]]
tick = 1834
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern_office_room"
[[input]]
tick = 1839
name = "core.close"
source = "mouse"
payload = { down = true }
[[expect]]
tick = 1839
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"
[[input]]
tick = 1869
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 1839 }

# Esc shuts the open log too.
[[input]]

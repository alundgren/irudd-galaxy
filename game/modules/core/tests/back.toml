payload = { down = true }
[[input]]
tick = 1579
name = "core.close"
source = "keyboard"
payload = { down = false }
[[expect]]
tick = 1579
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"
[[expect]]
tick = 1579
entity = "ship"
component = "pilot"
field = "gliding"
equals = true
[[input]]
tick = 1608
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 1578 }
[[expect]]
tick = 1608
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = ""
[[expect]]
tick = 1608
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""


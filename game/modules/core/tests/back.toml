# Rooms cut and go back: a click on a building cuts into its room, a place of its own;
# Esc, right-click or B cuts back out to the station; Esc also shuts the log. Each keeper
# wears a name sign in their own room, none while the view moves or on the deck, and
# while someone speaks only the speaker keeps theirs. Launching from a room flies off.
# Play records engine.place_arrived when a cut or glide lands; here it is given by hand.
seed = 3
ticks = 700

[[input]]
tick = 1
name = "core.ahead"
payload = { down = true }
[[input]]
tick = 11
name = "core.ahead"
payload = { down = false }
[[input]]
tick = 60
name = "core.mine"
[[input]]
tick = 330
name = "core.dock"
payload = { station = "core.lantern" }

# Arriving glides in: no signs until it lands.
[[expect]]
tick = 420
entity = "ship"
component = "pilot"
field = "gliding"
equals = true
[[expect]]
tick = 420
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 450
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 396 }
[[expect]]
tick = 450
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[expect]]
tick = 450
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"

# A click on the exchange building cuts into its room, where Tova stands.
[[input]]
tick = 500
name = "core.open"
source = "ui"
payload = { facility = "core.lantern_exchange" }
[[expect]]
tick = 500
entity = "ship"
component = "pilot"
field = "room"
equals = "core.lantern_exchange"
[[expect]]
tick = 500
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern_exchange_room"
[[expect]]
tick = 500
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 530
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_exchange_room", start_tick = 500 }
[[expect]]
tick = 530
entity = "ship"
component = "pilot"
field = "gliding"
equals = false
[[expect]]
tick = 530
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = "Tova Reyes"
[[expect]]
tick = 530
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = ""

# Esc cuts back out to the whole station; letting go of it does nothing more.
[[input]]
tick = 540
name = "core.close"
source = "keyboard"
payload = { down = true }
[[input]]
tick = 541
name = "core.close"
source = "keyboard"
payload = { down = false }
[[expect]]
tick = 541
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"
[[expect]]
tick = 541
entity = "ship"
component = "pilot"
field = "gliding"
equals = true
[[input]]
tick = 570
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 540 }
[[expect]]
tick = 570
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = ""
[[expect]]
tick = 570
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""

# The office from its building, then straight back with a right-click mid-cut.
[[input]]
tick = 580
name = "core.open"
source = "ui"
payload = { facility = "core.lantern_office" }
[[expect]]
tick = 580
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern_office_room"
[[input]]
tick = 585
name = "core.close"
source = "mouse"
payload = { down = true }
[[expect]]
tick = 585
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.lantern"
[[input]]
tick = 615
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 585 }

# Esc shuts the open log too.
[[input]]
tick = 620
name = "core.log"
[[expect]]
tick = 620
entity = "ship"
component = "pilot"
field = "log_open"
equals = true
[[input]]
tick = 625
name = "core.close"
source = "keyboard"
payload = { down = true }
[[expect]]
tick = 625
entity = "ship"
component = "pilot"
field = "log_open"
equals = false
[[expect]]
tick = 625
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""

# In his office Bram wears his sign, and keeps it while he speaks.
[[input]]
tick = 630
name = "core.open"
source = "ui"
payload = { facility = "core.lantern_office" }
[[input]]
tick = 633
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_office_room", start_tick = 630 }
[[expect]]
tick = 634
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = "Bram Okafor"
[[input]]
tick = 640
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_master_intro" }
[[expect]]
tick = 641
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[expect]]
tick = 641
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = "Bram Okafor"

# Launching from inside a room flies straight off.
[[input]]
tick = 650
name = "core.open"
source = "ui"
payload = { facility = "core.lantern_exchange" }
[[input]]
tick = 660
name = "core.launch"
[[expect]]
tick = 660
entity = "ship"
component = "pilot"
field = "gliding"
equals = false
[[expect]]
tick = 660
entity = "ship"
component = "engine.location"
field = "place"
equals = "core.reach"

# Collision under held thrust: W from the start flies the ship straight at rock1. It
# stops on the rock's surface (it would be at x 13 by tick 30 if it passed through),
# then glances off round the rock rather than through it, and the rock turns slowly but
# never moves.
ticks = 91
[[input]]
tick = 1
name = "ahead"
payload = { down = true }
[[input]]
tick = 90
name = "ahead"
payload = { down = false }

# On the surface: the rock (at x 12) stops it short.
[[expect]]
tick = 24
entity = "ship"
component = "engine.position"
field = "x"
at_most = 8.3

# Pressed against the curved side, it slides round it instead of sticking or passing.
[[expect]]
tick = 30
entity = "ship"
component = "engine.position"
field = "x"
at_most = 10.2
[[expect]]
tick = 30
entity = "ship"
component = "engine.position"
field = "y"
at_least = 2

[[expect]]
entity = "rock1"
component = "engine.position"
field = "x"
equals = 12
[[expect]]
entity = "rock1"
component = "engine.position"
field = "y"
equals = 0

# It turns slowly where it floats (3 degrees a second: 9 degrees, 0.157 radians, by tick
# 90), bumped or not, and still never moves.
[[expect]]
tick = 90
entity = "rock1"
component = "engine.position"
field = "angle"
at_least = 0.155
[[expect]]
tick = 90
entity = "rock1"
component = "engine.position"
field = "angle"
at_most = 0.159

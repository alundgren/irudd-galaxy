# One conversation stays one log entry, and speech keeps its speaker's name. Opening
# the log ends Bram's introduction unseen; with the log shut it begins again, his sign
# stays while his bubble does, the other keeper's steps aside, and every sign is back
# once he has finished. Tova's introduction is interrupted by a sale and still ends as
# one entry in reading order.
seed = 3
ticks = 700

[[input]]
tick = 1
name = "core.ahead"
payload = { down = true }
[[input]]
tick = 11
name = "core.ahead"
payload = { down = false }
[[input]]
tick = 60
name = "core.mine"
[[input]]
tick = 330
name = "core.dock"
payload = { station = "core.lantern" }
[[input]]
tick = 450
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 395 }

# Bram starts his introduction, then the log opens: it takes the whole focus, so his
# bubble ends unseen and no sign shows.
[[input]]
tick = 500
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_master_intro" }
[[input]]
tick = 505
name = "core.log"
[[expect]]
tick = 506
entity = "lantern_master_intro"
component = "engine.talk"
field = "active"
equals = false
[[expect]]
tick = 506
entity = "lantern_master_intro"
component = "engine.talk"
field = "seen"
equals = false
[[expect]]
tick = 506
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 510
name = "core.log"
[[expect]]
tick = 511
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = "Bram Okafor"
# With the log shut his introduction begins again and plays through.
[[input]]
tick = 512
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_master_intro" }
[[expect]]
tick = 512
entity = "lantern_master_intro"
component = "engine.talk"
field = "current"
equals = "core.lantern_master_intro1"
[[input]]
tick = 515
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro1" }
[[input]]
tick = 518
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro2" }
[[input]]
tick = 520
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro3" }
[[expect]]
tick = 521
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = "Bram Okafor"
[[expect]]
tick = 521
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 523
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro4" }
# His last line: the bubble goes, and every keeper's sign is back.
[[input]]
tick = 525
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro5" }
[[expect]]
tick = 526
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = "Tova Reyes"
[[expect]]
tick = 526
entity = "log3"
component = "entry"
field = "text"
equals = "Bram Okafor at Lantern Dock: “Welcome to Lantern Dock.” “I'm Bram. I keep the berth and lamps.” “Cinder Kiln is the other station.” “It's out east, and pays more for ore.” “We're raising a galley. It needs plate.”"

# Tova's introduction, with a sale after her first line.
[[input]]
tick = 540
name = "core.open"
[[input]]
tick = 550
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_intro" }
[[input]]
tick = 555
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro1" }
[[input]]
tick = 560
name = "core.sell"
# The sale is logged after her first line, as the newest entry.
[[expect]]
tick = 561
entity = "ship"
component = "pilot"
field = "logged"
equals = 5
[[input]]
tick = 565
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro2" }
[[input]]
tick = 570
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro3" }
[[expect]]
tick = 571
entity = "log4"
component = "entry"
field = "text"
equals = "Tova Reyes at Lantern Dock: “I'm Tova, and I run the exchange.” “I buy ore, and plate for our galley.” “My prices drop as my stock fills.”"
# Her later lines joined that entry: nothing new was logged.
[[expect]]
tick = 571
entity = "ship"
component = "pilot"
field = "logged"
equals = 5

# Her next conversation is a new entry, not more of the finished introduction.
[[input]]
tick = 580
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_talk" }
[[input]]
tick = 585
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_talk", line = "core.lantern_trader_now" }
[[expect]]
tick = 586
entity = "log6"
component = "entry"
field = "text"
equals = "Tova Reyes at Lantern Dock: “Thanks. It's all on the pile already.”"

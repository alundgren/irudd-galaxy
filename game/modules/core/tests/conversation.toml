# One conversation stays one log entry, and speech keeps its speaker's name. In his
# office, Bram's sign stays while his bubble does, Tova (in her exchange) wears none,
# and his sign is still there once he has finished. In the exchange Tova's introduction is
# interrupted by a sale and still ends as one entry in reading order.
seed = 3
ticks = 1738

[[input]]
tick = 1
name = "core.ahead"
payload = { down = true }
[[input]]
tick = 11
name = "core.ahead"
payload = { down = false }
[[input]]
tick = 60
name = "core.mine"
[[input]]
tick = 960
name = "core.dock"
payload = { station = "core.lantern" }
[[input]]
tick = 1488
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern", start_tick = 1434 }
[[input]]
tick = 1508
name = "core.open"
source = "ui"
payload = { facility = "core.lantern_office" }
[[input]]
tick = 1511
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_office_room", start_tick = 1508 }

# Bram's introduction plays through, his sign staying while his bubble does.
[[input]]
tick = 1550
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_master_intro" }
[[expect]]
tick = 1550
entity = "lantern_master_intro"
component = "engine.talk"
field = "current"
equals = "core.lantern_master_intro1"
[[input]]
tick = 1553
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro1" }
[[input]]
tick = 1556
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro2" }
[[input]]
tick = 1558
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro3" }
[[expect]]
tick = 1559
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = "Bram Okafor"
[[expect]]
tick = 1559
entity = "lantern_trader"
component = "engine.life"
field = "name"
equals = ""
[[input]]
tick = 1561
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro4" }
# His last line: the bubble goes, and his sign stays.
[[input]]
tick = 1563
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_master_intro", line = "core.lantern_master_intro5" }
[[expect]]
tick = 1564
entity = "lantern_master"
component = "engine.life"
field = "name"
equals = "Bram Okafor"
[[expect]]
tick = 1564
entity = "log6"
component = "entry"
field = "text"
equals = "Bram Okafor at Lantern Dock: “Welcome to Lantern Dock.” “I'm Bram. I keep the berth and lamps.” “Cinder Kiln is out east. We both buy ore.” “Each of us pays less as our stock fills, so spread your loads.” “Our galley wants plate: sheet the Kiln fires from ore.”"

# Tova's introduction, with a sale after her first line.
[[input]]
tick = 1578
name = "core.open"
[[input]]
tick = 1581
name = "engine.place_arrived"
source = "travel"
payload = { entity = "core.ship", place = "core.lantern_exchange_room", start_tick = 1578 }
[[input]]
tick = 1588
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_intro" }
[[input]]
tick = 1593
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro1" }
[[input]]
tick = 1598
name = "core.sell"
# The sale is logged after her first line, as the newest entry.
[[expect]]
tick = 1599
entity = "ship"
component = "pilot"
field = "logged"
equals = 8
[[input]]
tick = 1603
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro2" }
[[input]]
tick = 1608
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_intro", line = "core.lantern_trader_intro3" }
[[expect]]
tick = 1609
entity = "log7"
component = "entry"
field = "text"
equals = "Tova Reyes at Lantern Dock: “I'm Tova, and I run the exchange.” “I buy ore, and plate for our galley: sheet the Kiln fires from ore.” “My prices drop as my stock fills.”"
# Her later lines joined that entry: nothing new was logged.
[[expect]]
tick = 1609
entity = "ship"
component = "pilot"
field = "logged"
equals = 8

# Her next conversation is a new entry, not more of the finished introduction.
[[input]]
tick = 1618
name = "engine.talk_start"
source = "talk"
payload = { talk = "core.lantern_trader_talk" }
[[input]]
tick = 1623
name = "engine.talk_next"
source = "talk"
payload = { talk = "core.lantern_trader_talk", line = "core.lantern_trader_now" }
[[expect]]
tick = 1624
entity = "log9"
component = "entry"
field = "text"
equals = "Tova Reyes at Lantern Dock: “Thanks. It's all on the pile already.”"

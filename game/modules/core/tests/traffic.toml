# Traffic: Little Mercy waits moored off Lantern Dock, sets off on her own after her
# wait, and is bumped aside when the player's ship flies across her route; she still
# reaches her mooring off Cinder Kiln. The ship turns south and flies out to wait on her
# lane, well south of the field. Quiet Lamp flies the long way round the field, moors
# off Cinder Kiln, flies back and moors off Lantern Dock. The traders' arrivals never
# dock the player, and nothing takes damage.
seed = 7
ticks = 5200

[[input]]
tick = 1
name = "right"
payload = { down = true }

[[input]]
tick = 16
name = "right"
payload = { down = false }

[[input]]
tick = 370
name = "ahead"
payload = { down = true }

[[input]]

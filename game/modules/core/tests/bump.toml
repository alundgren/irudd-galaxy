# Bumps (scripts/sound.luau): W from the start flies the ship into rock1 (as in
# collision.toml). The collide service records engine.contact as they meet, at least as
# fast as the manifest's contact_speed, and the ship's part in it records one bump for
# the hull's knock. Pressing on against the rock is the same contact: still one bump
# (the small rock soon turns her aside, so the press is short). Backing off and flying in
# again knocks again.
ticks = 121
[[input]]
tick = 1
name = "ahead"
payload = { down = true }
[[input]]
tick = 29
name = "ahead"
payload = { down = false }
[[input]]
tick = 29
name = "back"
payload = { down = true }
[[input]]
tick = 54
name = "back"
payload = { down = false }
[[input]]
tick = 69
name = "ahead"
payload = { down = true }
[[input]]
tick = 119
name = "ahead"
payload = { down = false }

[[expect]]
tick = 15
facts = "bump"
equals = 0
[[expect]]
tick = 28
facts = "bump"
equals = 1
[[expect]]

# The fitting loop at Cinder Kiln's cradle: the rack is stocked and priced; a part that
# can't be paid for, put in the wrong socket or that needs more power than is free does
# nothing when dropped; the lens is bought and fitted with one receipt, taken off into
# the locker and fitted again for nothing, and its two ore a second fill the hold; the
# pods make the hold 36 and the ship slower, with wider turns, and can't come off while
# 36 are aboard. The drops are the events the cradle's drop targets send.
#
# Starts beside Cinder Kiln's berth with a hold of ore and 2,879 credits, one hold short
# of the lens; the pods' price and the ore aboard are set with [[edit]] entries before
# each phase, and the mining runs start beside rock5.
seed = 7
ticks = 800
[[edit]]
entity = "ship"
component = "pilot"
set = { credits = 2879 }
[[edit]]
entity = "ship"
component = "hold"
set = { ore = 24 }
[[edit]]
entity = "ship"
component = "engine.position"
set = { x = 200, y = -249 }

# A new game's ship flies the locked flight's bare hull, and the rack is priced.
[[expect]]
tick = 1
entity = "ship"
component = "fit"
field = "hull_speed"
equals = 20.0
[[expect]]
tick = 1
entity = "lens"
component = "part"
field = "owned"
equals = false
[[expect]]
tick = 1
entity = "lens"
component = "part"
field = "price"
equals = 3000
[[expect]]
tick = 1
entity = "pods"
component = "part"
field = "price"
equals = 3500
[[expect]]
tick = 1
entity = "thrusters"
component = "part"
field = "price"
equals = 9000
[[expect]]
tick = 1
entity = "ship"
component = "fit"
field = "hold"
equals = 24
[[expect]]
tick = 1
entity = "ship"
component = "fit"
field = "mine"
equals = 1
[[input]]
tick = 1
name = "core.dock"
source = "script"
payload = { station = "core.kiln" }
[[expect]]
tick = 50
facts = "core.docked"
equals = 1


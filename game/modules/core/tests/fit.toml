# The fitting loop at Cinder Kiln's cradle: on a new game the rack is stocked and priced;
# a part that can't be paid for, put in the wrong socket or that needs more power than
# is free does nothing when dropped; the lens is bought and fitted with one receipt,
# taken off into the locker and fitted again for nothing, and its two ore a second fill
# the next hold; the pods make the hold 9 and the ship slower, with wider turns, and
# can't come off while nine are aboard. The drops are the events the cradle's drop
# targets send. tests/fit.inputs holds the same route for sim runs and shots.
seed = 7
ticks = 1460


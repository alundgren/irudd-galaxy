# After the greenhouse, Cold Kettle adrift (scripts/salvage.luau, scripts/tow.luau), mended
# at Cinder Kiln, played end to end from a finished greenhouse: Noor's ask (Accept), the
# line passed, towed into Cinder Kiln's berth instead and handed to Mags with the
# office's handover button, a hold of ore and 4 of it handed to Mags for Orrin's pump,
# Orrin's welding on her, two trips out and back, Hessa's thanks and her fee taken, and
# the barge sailing her route again when you launch, with lamps on Cinder Kiln's quay for
# three dockings. Shared history on this branch (scripts/history.luau): aboard in Mags's
# office, Hessa wears her sign at once, and her introduction starts with the Kiln mending
# her barge, not with who she is; its last line follows the work. Her fee taken, her
# next line remembers it.
#
# Starts on Lantern Dock's berth with the galley one plate short, that plate aboard,
# credits for the shopping and the day as the trade route's trades leave it (set, not
# played through the trade route). From there it
# plays the greenhouse as greenhouse.toml does, with every trip set, not flown: the
# launch, what the hold carries after it, "away" where the trip was a visit, and the ship
# put on the next berth to dock (the glassite trip stops by the stone ring, so it wakes).
# The barge's trips are set too: the ship is put alongside her and passes the line by a
# script's order, then ship and barge are put by Cinder Kiln's berth, the line still
# fast, and the ship docks. The last stretch is real time: half a minute after she
# sails, she is still out on her route.

# pace-numbers for the navigation spine: a new world played along the spine with scripted
# orders, as `galaxy sim run` plays it (30 ticks a second). Seed 7, the bare hull, scripted
# Mine and Dock orders (a little better than a hand flies, the steady beam), two seconds
# between clicks. W by hand first (Bram's welcome); the first full hold goes to Cinder
# Kiln, where Orrin's introduction finds the tag and the chart glass's drawing; then the
# holds go to the other station each time, and at the first Kiln visit with the credits
# for it, the plate is bought from Sefa and the chart glass made and fitted. Headless,
# nothing draws the glide into the cradle room, so its arrival is given two seconds after
# the click, as the view sends it in play.
#
# The drawing is found 1.1 minutes in (tick 2003), the chart glass fitted 10.3 minutes in
# (tick 18453), after the 9th hold. By hand the README's route ratio (about 1.33) makes
# that about 1.5 and 14 minutes. These ticks guard the price against drift; they are a
# measurement, not a target.
seed = 7
ticks = 18460

[[expect]]
tick = 2002
facts = "core.drawn"
equals = 0
[[expect]]
tick = 2003
facts = "core.drawn"
equals = 1
[[expect]]
tick = 18452
facts = "core.fitted"
equals = 0
[[expect]]
tick = 18453
facts = "core.fitted"
equals = 1
[[expect]]
tick = 18453
facts = "core.hold_full"
equals = 9


# Sefa's lead is followable (start.toml, glassite_lead): "Fly north from our berth, a touch
# east. It's far." Docked at Cinder Kiln and launched from its berth, the ship turns by
# keys alone to 15 degrees east of north, as her words give it, and flies
# straight on by keys: no orders, no Dock or Mine. It comes to where the lone buoy
# (buoy_glassite) lie well inside the view: at cruise the view shows about 64 units each side
# of the ship and 41 ahead and behind, and the expectation keeps a margin of 15 and 11.
seed = 7
ticks = 895

# Starts just off Cinder Kiln's berth, docking.
[[edit]]
entity = "ship"
component = "engine.position"
set = { x = 200, y = -249 }
[[input]]
tick = 1
name = "core.dock"
source = "script"
payload = { station = "core.kiln" }

[[input]]
tick = 60
name = "core.launch"

[[input]]
tick = 100
name = "core.right"
payload = { down = true }

[[input]]
tick = 110
name = "core.right"
payload = { down = false }

[[input]]
tick = 120
name = "core.ahead"
payload = { down = true }

# Her words, which this heading comes from.
[[expect]]
tick = 1
entity = "glassite_lead2"
component = "engine.talk_line"
field = "text"
equals = "Fly north from our berth, a touch east. It's far."

[[expect]]
tick = 61
entity = "ship"
component = "engine.position"
field = "x"
equals = 206

[[expect]]
tick = 61
entity = "ship"
component = "engine.position"
field = "y"
equals = -255

[[expect]]
tick = 894
entity = "ship"
component = "engine.position"
field = "x"
at_least = 286

[[expect]]
tick = 894
entity = "ship"
component = "engine.position"
field = "x"
at_most = 382

[[expect]]
tick = 894
entity = "ship"
component = "engine.position"
field = "y"
at_least = 208

[[expect]]
tick = 894
entity = "ship"
component = "engine.position"
field = "y"
at_most = 262

# What is seen there, where the box above is drawn round.
[[expect]]
tick = 894
entity = "buoy_glassite"
component = "engine.position"
field = "x"
equals = 334

[[expect]]
tick = 894
entity = "buoy_glassite"
component = "engine.position"
field = "y"
equals = 238

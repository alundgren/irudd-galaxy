# The ship log keeps where each entry happened, so its screen can show one line per
# visit: the full hold out in the reach belongs to the flight, and the docking's own
# entry, written on the tick the ship arrives, already belongs to the station. Opening
# the log marks what is in it as seen (the book's "N new" goes), and Lines opens one
# visit and closes it again.
seed = 3
ticks = 1854

[[input]]
tick = 1
name = "core.ahead"
payload = { down = true }
[[input]]
tick = 11
name = "core.ahead"
payload = { down = false }
[[input]]
tick = 60
name = "core.mine"
[[input]]
tick = 900
name = "core.dock"
payload = { station = "core.lantern" }

[[expect]]
tick = 1754
entity = "log4"
component = "entry"
field = "text"
equals = "Docked at Lantern Dock."
[[expect]]
tick = 1754
entity = "log4"
component = "entry"
field = "at"
equals = "core.lantern"

[[input]]
tick = 1794
name = "core.log"
[[expect]]
tick = 1795
entity = "ship"
component = "logbook"
field = "seen"
equals = 4

[[input]]
tick = 1804
name = "core.log_visit"
payload = { first = 4 }
[[expect]]
tick = 1805
entity = "ship"
component = "logbook"
field = "visit"
equals = 4
[[input]]
tick = 1814
name = "core.log_visit"
payload = { first = 4 }
[[expect]]
tick = 1815
entity = "ship"
component = "logbook"
field = "visit"
equals = 0

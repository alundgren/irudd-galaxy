# The ship log keeps where each entry happened, so its screen can show one line per
# visit: the full hold out in the reach belongs to the flight, and the docking's own
# entry, written on the tick the ship arrives, already belongs to the station. Opening
# the log marks what is in it as seen (the book's "N new" goes), and Lines opens one
# visit and closes it again.
seed = 3
ticks = 1638

[[input]]
tick = 1
name = "core.ahead"
payload = { down = true }
[[input]]
tick = 11
name = "core.ahead"
payload = { down = false }
[[input]]
tick = 60
name = "core.mine"
[[input]]
tick = 960
name = "core.dock"
payload = { station = "core.lantern" }

[[expect]]
tick = 1538
entity = "log5"
component = "entry"
field = "text"
equals = "Docked at Lantern Dock."
[[expect]]
tick = 1538
entity = "log5"
component = "entry"
field = "at"
equals = "core.lantern"

[[input]]
tick = 1578
name = "core.log"
[[expect]]
tick = 1579
entity = "ship"
component = "logbook"
field = "seen"
equals = 5

[[input]]
tick = 1588
name = "core.log_visit"
payload = { first = 4 }
[[expect]]
tick = 1589
entity = "ship"
component = "logbook"
field = "visit"
equals = 4
[[input]]
tick = 1598
name = "core.log_visit"
payload = { first = 4 }
[[expect]]
tick = 1599
entity = "ship"
component = "logbook"
field = "visit"
equals = 0

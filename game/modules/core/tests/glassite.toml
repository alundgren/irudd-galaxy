# Glassite's crystals break off as it is mined: the ship turns north-east, flies the
# long way out to the glassite drift and mines glassite1 out. Its eight units come aboard
# and the emptied rock is left as a few pebbles with warm glowing caps (ore.empty). The
# order then moves on to glassite2, so the checks are taken at tick 1000, after
# glassite1's last unit and before the next.
seed = 7
ticks = 1001

[[input]]
tick = 1
name = "left"
payload = { down = true }

[[input]]
tick = 7
name = "left"
payload = { down = false }

[[input]]
tick = 10
name = "ahead"
payload = { down = true }

[[input]]
tick = 600
name = "ahead"
payload = { down = false }

[[input]]
tick = 660
name = "mine"

[[expect]]
tick = 662
entity = "ship"
component = "pilot"
field = "target"
equals = "core.glassite1"

[[expect]]
tick = 1000
entity = "ship"
component = "hold"
field = "glassite"
equals = 8

[[expect]]
tick = 1000
entity = "glassite1"
component = "ore"
field = "left"
equals = 0

[[expect]]
tick = 1000
entity = "glassite1"
component = "engine.model"
field = "model"
equals = "core.glassite_pebbles"

[[expect]]
tick = 1000
entity = "glassite1"
component = "engine.model"
field = "morph"
equals = 1.0

[[expect]]
tick = 1000
entity = "log1"
component = "entry"
field = "text"
equals = "Rock cut down to pebbles. 3 more rocks hold glassite."

[[expect]]
tick = 1000
facts = "mined"
equals = 8

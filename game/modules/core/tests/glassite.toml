# Glassite's crystals break off as it is mined: the ship turns north-east, flies to
# glassite1 and mines it out. Its five units come aboard, the rock is fully morphed
# and it wears its last stage, a shrunken rock with two glowing stumps.
seed = 7
ticks = 400

[[input]]
tick = 1
name = "left"
payload = { down = true }

[[input]]
tick = 6
name = "left"
payload = { down = false }

[[input]]
tick = 10
name = "ahead"
payload = { down = true }

[[input]]
tick = 100
name = "ahead"
payload = { down = false }

[[input]]
tick = 150
name = "mine"

[[expect]]
tick = 152
entity = "ship"
component = "pilot"
field = "target"
equals = "core.glassite1"

[[expect]]
entity = "ship"
component = "hold"
field = "glassite"
equals = 5

[[expect]]
entity = "glassite1"
component = "ore"
field = "left"
equals = 0

[[expect]]
entity = "glassite1"
component = "engine.model"
field = "model"
equals = "core.glassite_stubs"

[[expect]]
entity = "glassite1"
component = "engine.model"
field = "morph"
equals = 1.0

[[expect]]
entity = "ship"
component = "pilot"
field = "message"
equals = "Rock worked out."

[[expect]]
facts = "mined"
equals = 5

# The controls you earn. Both rest in the cradle's control rack until the pilot has done
# the work and can pay: Orrin fits the reach rig at 100 full holds cut and the docking
# jets at 200, and never fits either before, even with the price in hand. Bought, the
# jets stay fitted when dragged to the tray, and out in the reach E flies her into the
# nearest berth; from Cinder Kiln's berth, Space sends her out to the nearest rock, and
# the rig's long beam cuts it from sixteen units off with no key held.
#
# The work is set, not played: the holds and credits come from [[edit]] entries, and the
# ship starts beside Cinder Kiln's berth, so the run is twelve seconds of game time.
seed = 7
ticks = 350

# One hold short of the rig's hundred, with credits for both controls.
[[edit]]
entity = "ship"
component = "pilot"
set = { holds = 99, credits = 50000 }
[[edit]]
entity = "ship"
component = "engine.position"
set = { x = 200, y = -249 }

[[input]]
tick = 1
name = "core.dock"
source = "script"
payload = { station = "core.kiln" }
[[expect]]
tick = 50
facts = "core.docked"
equals = 1

# Ninety-nine holds: the rig's price is in hand, but Orrin wants a hundred.
[[input]]
tick = 50
name = "core.open"
payload = { facility = "core.kiln_cradle" }
[[input]]
tick = 59
name = "core.fit"
source = "ui"
payload = { socket = "rack", value = "core.rig" }
[[expect]]
tick = 69
entity = "rig"
component = "part"
field = "owned"
equals = false
[[expect]]
tick = 69
entity = "rig"
component = "part"
field = "fitted"
equals = false
[[expect]]
tick = 69
entity = "ship"
component = "pilot"
field = "credits"
equals = 50000
[[expect]]
tick = 69
facts = "core.fitted"
equals = 0

# A hundred full holds: the rig fits, for its price.
[[edit]]
tick = 70
entity = "ship"
component = "pilot"
set = { holds = 100 }
[[input]]
tick = 71
name = "core.fit"
source = "ui"
payload = { socket = "rack", value = "core.rig" }
[[expect]]
tick = 81
entity = "rig"
component = "part"
field = "fitted"
equals = true
[[expect]]
tick = 81
entity = "ship"
component = "pilot"
field = "credits"
equals = 35000
[[expect]]
tick = 81
facts = "core.fitted"
equals = 1

# A hundred and ninety-nine: the jets' price is in hand, but not the work.
[[edit]]
tick = 81
entity = "ship"
component = "pilot"
set = { holds = 199 }
[[input]]
tick = 82
name = "core.fit"
source = "ui"
payload = { socket = "rack", value = "core.jets" }
[[expect]]
tick = 92
entity = "jets"
component = "part"
field = "owned"
equals = false
[[expect]]
tick = 92
facts = "core.fitted"
equals = 1

# Two hundred: the jets fit; dragged to the tray, a bought control stays fitted.
[[edit]]
tick = 92
entity = "ship"
component = "pilot"
set = { holds = 200 }
[[input]]
tick = 93
name = "core.fit"
source = "ui"
payload = { socket = "rack", value = "core.jets" }
[[input]]
tick = 98
name = "core.unfit"
source = "ui"
payload = { value = "core.jets" }
[[expect]]
tick = 103
entity = "jets"
component = "part"
field = "fitted"
equals = true
[[expect]]
tick = 103
entity = "ship"
component = "pilot"
field = "credits"
equals = 5000
[[expect]]
tick = 103
facts = "core.fitted"
equals = 2

# Out in the reach, E: the jets fly her into the nearest berth.
[[input]]
tick = 104
name = "core.launch"
[[input]]
tick = 110
name = "core.ahead"
source = "keyboard"
payload = { down = true }
[[input]]
tick = 125
name = "core.ahead"
source = "keyboard"
payload = { down = false }
[[input]]
tick = 140
name = "core.dock"
source = "keyboard"
payload = { down = true }
[[input]]
tick = 141
name = "core.dock"
source = "keyboard"
payload = { down = false }
[[expect]]
tick = 141
entity = "ship"
component = "engine.steer"
field = "mode"
equals = "dock"
[[expect]]
tick = 141
entity = "ship"
component = "pilot"
field = "message"
equals = "The docking jets take her into Cinder Kiln."
[[expect]]
tick = 200
facts = "core.docked"
equals = 2


# The controls you earn. Both rest in the cradle's control rack until they can be paid
# for. After the first sale the docking jets are bought (80 cr); the reach rig can't be
# yet. Out in the reach, E then flies her into the nearest berth by itself. Two holds
# later the reach rig is bought too: from Cinder Kiln's berth, Space puts its long
# beam straight on the first rock, sixteen units off, aiming itself, and it cuts the
# hold full with no key held. Bought controls stay fitted: dragging one to the tray
# takes nothing off. The flights between sales are scripted orders, which fly themselves.

# The controls you earn. Both rest in the cradle's control rack until the pilot has done
# the work and can pay: Orrin fits the reach rig after 100 full holds cut and the docking
# jets after 200, says so in his own words, and never fits either before. After the first
# sale neither fits; eighty holds in, the rig's price is in hand but the work isn't. At
# a hundred holds the rig is bought: from Cinder Kiln's berth, Space sends her out to the
# nearest rock, and its long beam cuts the hold full from sixteen units off with no key
# held. Once the jets are earned and paid for, they are bought; dragged to the tray, a
# bought control stays fitted, and out in the reach E flies her into the nearest berth.
# Every flight between sales is a scripted order, which flies itself. This is several
# hours of play, so the run is long.
seed = 7

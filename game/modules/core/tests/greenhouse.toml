# After the galley, Ines's greenhouse (scripts/project.luau), played end to end from a
# finished galley: her gift taken, a counted docking back (her ask waits for one), then
# her ask (Accept), glassite handed to Sefa at Cinder Kiln, a counted visit there while
# the panes fire, the panes loaded as Ines's and handed to her in her galley, glaziers on
# the deck, two loads of ice sold at the exchange for the beds, and the greenhouse built:
# Noor arrives, Ines thanks you, the station wears its greenhouse and holds a lamp night
# for three counted dockings.
#
# Starts on Lantern Dock's berth with the galley one plate short, that plate aboard and
# credits for a ration (set, not played through the trade route). Every trip between
# the talks is set, not flown: the launch, what the hold carries after it (8 glassite
# cut, a hold of ore, a load of ice), "away" where the trip was a visit, and the ship
# put on the next berth to dock. The glassite trip stops by the stone ring first, so it
# wakes as it does on the way to the drift.

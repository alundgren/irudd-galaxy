# The day: it moves on with the work done at the stations (a trade, a fit), never with
# time, and the stations' people go about their acts (scripts/trade.luau). One day for
# both stations, so check can try every arrangement of it.
[entities.day]
"engine.clock" = {}

[entities.reach]
"engine.place" = { width = 160, depth = 100 }

[entities.ship]
"engine.being" = { player = true }
"engine.location" = { place = "core.reach" }
"engine.position" = { x = 0, y = 0 }
"engine.motion" = {}
# The locked flight preset (#47) at the core's view of 64 units: top speed, thrust and
# braking are 0.3, 0.45 and 0.35 view heights a second, letting go of thrust stops the
# ship in a second, a little inertia, and turns at 180 degrees a second.
"engine.flight" = { speed = 20, accel = 30, brake = 23.3, stop_time = 1.0, inertia = 0.4, turn = 180 }
"engine.helm" = {}
"engine.steer" = {}
"engine.body" = { mass = 1 }
"engine.model" = { model = "core.ship", look = "core.ship" }
# A warm trail while the engines push.
"engine.emitter" = { recipe = "core.exhaust", x = -1.7, by = "thrust" }
"engine.camera" = { view = 64, min_view = 24, max_view = 100, tilt = 30 }
# The view widens a little at speed and looks a quarter second ahead; mining beats kick
# it (scripts/main.luau keeps the same values).
"engine.camera_feel" = { speed_zoom = 0.12, lead = 0.25 }
pilot = { message = "A quiet shift. Mine six ore, then choose a buyer." }
hold = {}
held = {}
taught = {}
fit = { hull_speed = 20.0 }
# The radio finds the strongest station on its first second out (scripts/radio.luau).
radio = {}

# The field: rocks turn slowly where they float, never drifting, so every mining spot
# stays put. Space mines the nearest rock with anything left, whatever it holds.
#

# The parts on Orrin's rack. The hull has 3 power and carries 3 mass freely, so the
# lens and the thrusters can't run together, and the pods with anything else slow you.
[entities.lens]
part = { name = "Cutting lens", socket = "drill", price = 3000, power = 2, mass = 1, mine = 1, order = 1, effect = "your beam cuts 2 ore a second instead of 1", said = "That lens cuts twice as quick." }

[entities.pods]
part = { name = "Hold pods", socket = "hold", price = 3500, mass = 3, hold = 12, order = 2, model = "core.ship_pods", effect = "your hold carries 36 instead of 24", said = "Room for twelve more. She's heavier, mind." }

[entities.thrusters]
part = { name = "Tuned thrusters", socket = "engine", price = 9000, power = 2, mass = 1, speed = 5, order = 3, effect = "your top speed goes from 20 to 25", said = "Open her up out there. She'll run." }

# Two controls take over work the pilot does by hand (scripts/cutter.luau). They sit in
# the control rack: no power or mass, and once bought they never come off. The reach rig
# aims the beam itself, cuts from far off and flies the ship out to a rock; the docking
# jets fly it into a berth from anywhere.
[entities.rig]
part = { name = "Reach rig", socket = "rack", price = 15000, holds = 100, order = 4, effect = "click a rock, or press Space, and she flies out and cuts it from 16 units off, aiming herself, her beam held steady: no rock runs warm or glazes under it", said = "She'll stand off now and pull the stone in herself. Steady, mind: a good hand on a warm rock still cuts faster." }

[entities.jets]
part = { name = "Docking jets", socket = "rack", price = 30000, holds = 200, order = 5, effect = "press E or click a station, and they fly her into its berth from anywhere", said = "Point her home and let the jets do the berthing." }


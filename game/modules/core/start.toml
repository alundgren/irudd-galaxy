# The parts on Orrin's rack. The hull has 3 power and carries 3 mass freely, so the
# lens and the thrusters can't run together, and the pods with anything else slow you.
[entities.lens]
part = { name = "Cutting lens", socket = "drill", price = 90, power = 2, mass = 1, mine = 1, order = 1, effect = "your beam cuts 2 ore a second instead of 1", said = "That lens cuts twice as quick." }

[entities.pods]
part = { name = "Hold pods", socket = "hold", price = 70, mass = 3, hold = 3, order = 2, model = "core.ship_pods", effect = "your hold carries 9 instead of 6", said = "Room for three more. She's heavier, mind." }

[entities.thrusters]

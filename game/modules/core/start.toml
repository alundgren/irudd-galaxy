# Two controls take over work the pilot does by hand (scripts/cutter.luau). They sit in
# the control rack: no power or mass, and once bought they never come off. The reach rig
# aims the beam itself, cuts from far off and flies the ship out to a rock; the docking
# jets fly it into a berth from anywhere.
[entities.rig]
part = { name = "Reach rig", socket = "rack", price = 140, order = 4, effect = "click a rock, or press Space, and she flies out and cuts it from 16 units off, aiming herself", said = "She'll stand off now and pull the stone in herself." }

[entities.jets]
part = { name = "Docking jets", socket = "rack", price = 80, order = 5, effect = "press E or click a station, and they fly her into its berth from anywhere", said = "Point her home and let the jets do the berthing." }


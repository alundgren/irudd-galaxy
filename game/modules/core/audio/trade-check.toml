# The trade run (galaxy-gm audio check): even with rooms, sales and purchases a few
# ticks apart, the effects stack without reaching the clamp.
scenario = "trade.toml"

[[expect]]
value = "buses.sound.integrated_lufs"
at_least = -30.0
at_most = -22.0

[[expect]]
value = "buses.sound.momentary_max_lufs"
at_most = -16.0

[[expect]]
value = "playback.sample_peak_dbfs"
at_most = -3.0

[[expect]]
value = "limited_samples"
equals = 0

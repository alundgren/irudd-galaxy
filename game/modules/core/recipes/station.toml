about = "A compact lantern-lit ring station"
# The ring turns slowly (a full turn a minute) and its lamps breathe; the mast's tip
# lamp blinks a little quicker. Both are drawn only, so they change no world state.
[[part]]
shape = "spoked_ring"
radius = 5
tube = 0.7
inner = 1.8
spin = 6
pulse = 4
pulse_low = 0.45
[[part]]
shape = "tiers"
radius = 2
height = 2.8
[[part]]
shape = "panel"
length = 4
width = 2
at = [-5, 0, 0]
turn = 180
[[part]]
shape = "mast"
height = 4
at = [0, 2.5, 0]
pulse = 2.5
pulse_low = 0.2
# Lantern Dock's mark on its dock arm, face up: a lit gold lantern on a lantern-green
# disc. The direction doc gives each owner a mark as well as a shape and paint (1.3).
[[part]]
name = "mark"
shape = "cylinder"
radius = 0.95
height = 0.08
sides = 16
at = [-7, 0, 0.32]
paint = "trim"
[[part]]
name = "mark_lantern"
shape = "plate"
outline = [[-0.3, -0.45], [0.3, -0.45], [0.38, -0.3], [0.38, 0.25], [0.25, 0.38], [-0.25, 0.38], [-0.38, 0.25], [-0.38, -0.3]]
height = 0.1
at = [-7, -0.05, 0.4]
paint = "accent"
glow = 0.5
[[part]]
name = "mark_cap"
shape = "plate"
outline = [[-0.16, 0.38], [0.16, 0.38], [0.1, 0.58], [-0.1, 0.58]]
height = 0.1
at = [-7, -0.05, 0.4]
paint = "accent"

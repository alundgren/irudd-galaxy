about = "Cinder Kiln: a square, ordered smelting quay, cream with brass trim and deep red caps"
# Square and ordered (direction doc 1.3, Tollway Compact), where Lantern Dock is round:
# a square brass quay frame that holds still, a block with four corner kilns round a
# tall chimney that breathes steam (start.toml), a fan turning on the stack, a toll gate
# and neat crate rows on the dock arm, red banners on the corner lamp posts. A used
# recipe's motion isn't carried into the part that uses it, so the parts carry their
# own: the fan turns, the corner lamps keep a steady beat and the kiln mouths glow.
# Everything stays inside the frame's reach except the dock arm out west, so the
# footprint (and the berths beside it) are as before.
palette = { main = "#f3ddb0", trim = "#c98f4a", accent = "#8f3040" }
[[part]]
name = "quay"
shape = "ring"
radius = 5.4
tube = 0.9
flat = 0.55
segments = 4
sides = 4
turn = 45
paint = "trim"
[[part]]
name = "quay_deck"
shape = "ring"
radius = 4.5
tube = 0.7
flat = 0.3
segments = 4
sides = 4
turn = 45
paint = "main"
[[part]]
name = "struts"
shape = "truss"
length = 2.4
width = 0.45
collar_every = 0.8
copies = 4
distance = 1.5
paint = "trim"
trim = "accent"
[[part]]
name = "core"
shape = "block"
depth = 3.0
width = 3.0
height = 2.2
at = [0, 0, -0.4]
[[part]]
name = "kilns"

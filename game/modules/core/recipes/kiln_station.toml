about = "Cinder Kiln: square and ordered, cream with brass trim and deep red caps"
# The same ring and footprint as station.toml, but its core is square: a block with four
# corner kilns round a tall chimney, where Lantern Dock has round lantern tiers. A used
# recipe's motion isn't carried into the part that uses it, so the parts are listed here
# with their own: the ring turns the other way, a little slower, and the lamps keep their
# own beat.
palette = { main = "#f3ddb0", trim = "#c98f4a", accent = "#8f3040" }
[[part]]
shape = "spoked_ring"
radius = 5
tube = 0.7
inner = 1.8
spokes = 4
spin = -5
pulse = 5
pulse_low = 0.45
[[part]]
name = "core"
shape = "block"
depth = 3.0
width = 3.0
height = 2.2
at = [0, 0, -0.4]
[[part]]
name = "kilns"
shape = "box"
size = [0.9, 0.9, 1.4]
copies = 4
angle = 45
distance = 2.1
at = [0, 0, 0.5]
paint = "accent"
[[part]]
name = "chimney"
shape = "spire"
radius = 0.6
height = 3.6
at = [0, 0, 1.6]
[[part]]
shape = "panel"
length = 4
width = 2
at = [-5, 0, 0]
turn = 180
[[part]]
shape = "mast"
height = 4
at = [0, 2.5, 0]
pulse = 3
pulse_low = 0.2
# Cinder Kiln's mark on its dock arm, face up: a brass flame on a deep red square. The
# direction doc gives each owner a mark as well as a shape and paint (1.3).
[[part]]
name = "mark"
shape = "box"
size = [1.5, 1.5, 0.08]
at = [-7, 0, 0.36]
paint = "accent"
[[part]]
name = "mark_flame"
shape = "plate"
outline = [[0.0, 0.55], [0.22, 0.2], [0.3, -0.1], [0.2, -0.35], [0.0, -0.45], [-0.2, -0.35], [-0.3, -0.1], [-0.22, 0.2]]
height = 0.1
at = [-7, 0, 0.4]
paint = "trim"
glow = 0.3

lantern = "lantern_deck"
kiln = "kiln_deck"

# The radio (scripts/radio.luau) records which channel should play; music fades across.
[[events]]
event = "radio_lantern"
sound = "lantern_radio"
bus = "music"
fade = 3.0

[[events]]
event = "radio_kiln"
sound = "kiln_radio"
bus = "music"
fade = 3.0

[[events]]
event = "radio_off"
bus = "music"
stop = true
fade = 2.0

# One-shot effects.

# Flying
[[events]]
event = "thrust_on"
sound = "thrust_on"
vary_pitch = 0.03
vary_gain = 0.15

[[events]]
event = "thrust_off"
sound = "thrust_off"
vary_pitch = 0.03
vary_gain = 0.15

[[events]]
event = "boost_on"
sound = "boost"


# Mining: the hum loops on its own channel from the beam's first touch on a rock to
# the moment it lets go (cutter.luau records cut_start and cut_stop), a chip for each
# second's ore, a chime when the hold is full
[[events]]
event = "cut_start"
sound = "mine_hum"
channel = "beam"
fade = 0.05

[[events]]
event = "cut_stop"
channel = "beam"
stop = true
fade = 0.15

[[events]]
event = "chip1"
sound = "mine_chip1"
vary_pitch = 0.05
vary_gain = 0.2

[[events]]
event = "chip2"
sound = "mine_chip2"
vary_pitch = 0.05
vary_gain = 0.2

[[events]]
event = "chip3"
sound = "mine_chip3"
vary_pitch = 0.05
vary_gain = 0.2

[[events]]
event = "hold_full"
sound = "hold_full"


# Docking
[[events]]
event = "docked"
sound = "dock_clunk"
vary_pitch = 0.02

[[events]]
event = "undocked"
sound = "undock_clunk"
vary_pitch = 0.02


# Screens and trade
[[events]]
event = "ui_click"
sound = "ui_click"
vary_pitch = 0.04
vary_gain = 0.15

[[events]]
event = "refused"
sound = "refused"

[[events]]
event = "sold"
sound = "sale_coin"
vary_pitch = 0.03
vary_gain = 0.1

[[events]]
event = "bought"
sound = "buy_goods"
vary_pitch = 0.03
vary_gain = 0.1

[[events]]
event = "confirmed"
sound = "receipt"

[[events]]
event = "grown"
sound = "built"


# Fitting: a part seats in its socket, or comes off into the locker
[[events]]
event = "fitted"
sound = "part_drop"
vary_pitch = 0.03


# Talk: each line's bubble
# A talk starting blips as its bubble opens ([ui.kinds.bubble] open, below).
[[events]]
event = "talk_line"
sound = "talk_blip"
vary_pitch = 0.05
vary_gain = 0.15

[[events]]
event = "engine.talk_chosen"
sound = "talk_blip"
vary_pitch = 0.05
vary_gain = 0.15


# The radio: a little static as it tunes a channel in
[[events]]
event = "radio_lantern"
sound = "radio_tune"
vary_pitch = 0.04

[[events]]
event = "radio_kiln"
sound = "radio_tune"
vary_pitch = 0.04


# Bumps: a soft knock on the hull, each a little different.
[[events]]
event = "bump"
sound = "bump"
vary_pitch = 0.08
vary_gain = 0.3


# Loops that follow the world, on their own channels while the ship flies.
[[events]]
event = "engine.start"
sound = "drive_hum"
channel = "drive"
fade = 1.0

[[events]]
event = "drive_on"
sound = "drive_hum"
channel = "drive"
fade = 1.0

[[events]]
event = "undocked"
sound = "drive_hum"
channel = "drive"
fade = 0.6

[[events]]

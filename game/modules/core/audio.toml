# The core's sound: each station's radio music, the ship's engine hum out in the reach,
# and each station's deck. Every file is a prepared loop (loop_crossfade = 0).
#
# Music: one Lyria generation per channel through `galaxy-gm music`, then trimmed before
# its fade-out, cleaned of DC, set to -23 LUFS (`audio process`) and looped with a 2 s
# blend (`audio loop`), stored as 16-bit PCM. At volume 1 under the 0.7 master it plays
# near -26 LUFS. Prompts:
#   lantern_radio: Calm lamplit harbour radio at night: slow warm folk, mellow
#     fingerpicked nylon guitar over soft Rhodes chords and a gentle upright bass, very
#     light brushed percussion, about 72 bpm. Soft, mellow, rounded, no bright or harsh
#     highs; clean, undistorted, restrained dynamics; stable centred bass. Steady even
#     energy from start to end, sparse voicing, compatible beginning and end, no intro,
#     no outro, no final cadence. (google/lyria-3-clip-preview)
#   kiln_radio: Slow warm ambient radio for a furnace station at night: deep soft analog
#     synth pads, a muted felt piano playing a few sparse low notes, a slow soft pulse
#     like banked coals, gentle warm bass, about 64 bpm. Soft, mellow, rounded, no bright
#     or harsh highs; clean, undistorted, restrained dynamics; stable centred bass,
#     mono-compatible stereo. Steady even energy from start to end, compatible beginning
#     and end, no intro, no outro, no final cadence. (google/lyria-3-clip-preview)
#
# Ambience: authored 16-second mono loops whose every partial and noise band repeats
# exactly, so they have no seam. reach: the tug's low engine hum with a slow beat over a
# faint cabin hush. lantern_deck: soft ventilation, a low hum and the lamps' warm buzz.
# kiln_deck: the furnace's banked roar, a low drone and a slow bellows breath.
#
# Effects: short one-shots on the sound bus, synthesised by sounds/make.py from sines,
# decaying modes and filtered noise (soft attacks, little above 4 kHz), then levelled
# with `audio process` (DC removed, silence trimmed, -18 LUFS or a gain under a -1 dBTP
# ceiling) and measured with `audio inspect`. Their volumes set them under the radio's
# music. scripts/sound.luau records the cue events for key presses and bumps;
# the other events are the game's own facts. mine_hum is one second long and fades
# over its last 0.12 s, the same length as its fade-in, so as it loops on the beam's
# channel each copy blends into the next and the hum holds while the beam cuts.
#
# Sound that follows the world (the feel pass): three loops play on their own channels
# of the sound bus while the ship flies, started by a new game, a resumed save or
# leaving a dock (sound.luau records `drive_on` for the last two) and stopped by
# docking. The drive's hum rises in pitch and gain with the ship's speed; each station's
# own deck sound swells as the ship passes close and is gone a little way out. Repeated
# cues vary a little in pitch and gain, so the chips, blips and clicks never sound
# stamped. A bump against a rock, a station or a trader knocks softly on the hull
# (`bump`, from sound.luau on engine.contact; the manifest sets contact_speed).
#
# Screens ([ui], at the end): the engine plays these from the view on the frame the
# player acts, outside the world. Hover is the faintest tick; a press is a click,
# softer and lower on parchment and dark buttons; a room's panel and the log open and
# close with the panel blips, a talk bubble with a blip; picking a part up lifts and
# letting it go sets it down; a resting button or a refusing socket answers with the
# refusal. scripts/sound.luau cues clicks for keys only, and no panels at all.
crossfade = 2.0

[sounds.lantern_radio]
file = "music/lantern_radio.wav"
volume = 1.0
loop_crossfade = 0


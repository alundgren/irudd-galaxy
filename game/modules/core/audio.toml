# The drive: almost nothing at rest, a low hum cruising, higher and fuller on boost
# (top speed 20 units a second, twice that boosted).
[[follow]]
channel = "drive"
entity = "ship"
component = "engine.motion"
field = ["vx", "vy"]
from = 0.0
to = 36.0
gain = [0.1, 1.0]
pitch = [0.8, 1.45]
power = 0.7
ramp = 0.15

# A station's deck sound: full at its rim, gone some forty units out.
[[follow]]
channel = "lantern_near"
entity = "ship"
distance_to = "lantern_exterior"
from = 10.0
to = 40.0
gain = [1.0, 0.0]
power = 0.6
ramp = 0.3

[[follow]]
channel = "kiln_near"
entity = "ship"
distance_to = "kiln_exterior"
from = 10.0
to = 40.0
gain = [1.0, 0.0]
power = 0.6
ramp = 0.3


# Screens. Every touch answers on the frame it happens.
[ui]
hover_gap = 0.08
hover = { sound = "ui_hover", vary_pitch = 0.06, vary_gain = 0.3 }
press = { sound = "ui_click", vary_pitch = 0.04, vary_gain = 0.15 }
drag = { sound = "part_lift", vary_pitch = 0.04 }
drop = { sound = "part_set", vary_pitch = 0.04 }
deny = "refused"

# Opening and closing sound only for the surfaces the player opens: a room's panel and
# the log (the place look). The plate, the status chip, the radio and the hint strip
# come and go together as the ship docks and leaves, where the dock's clunk speaks.
[ui.looks.room]
open = { sound = "panel_open", vary_pitch = 0.02 }
close = { sound = "panel_close", vary_pitch = 0.02 }

[ui.looks.place]
open = { sound = "panel_open", vary_pitch = 0.02 }
close = { sound = "panel_close", vary_pitch = 0.02 }

# Quiet choices (Back, Close, paging) and the radio's dark buttons click softer and lower.
[ui.looks.secondary]
press = { sound = "ui_tap", vary_pitch = 0.04, vary_gain = 0.15 }

[ui.looks.dark_button]
press = { sound = "ui_tap", vary_pitch = 0.04, vary_gain = 0.15 }

# Speech: a bubble opening blips like a line (the line's own blip comes with it), and
# clicking a bubble or a speaker only ticks, so the blip of the line that follows leads.
[ui.kinds.bubble]
open = { sound = "talk_blip", vary_pitch = 0.05, vary_gain = 0.15 }
close = { sound = "ui_hover", vary_pitch = 0.05 }
press = { sound = "ui_hover", vary_pitch = 0.05 }

[ui.kinds.speaker]
press = { sound = "ui_hover", vary_pitch = 0.05 }

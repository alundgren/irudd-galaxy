# The radio (scripts/radio.luau) records which channel should play; music fades across.
[[events]]
event = "radio_lantern"
sound = "lantern_radio"
bus = "music"
fade = 3.0

[[events]]
event = "radio_kiln"
sound = "kiln_radio"
bus = "music"
fade = 3.0

[[events]]
event = "radio_off"
bus = "music"
stop = true
fade = 2.0

# One-shot effects.


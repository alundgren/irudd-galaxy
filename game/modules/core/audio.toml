fade = 1.0

[[events]]
event = "drive_on"
sound = "lantern_near"
channel = "lantern_near"
fade = 1.0

[[events]]
event = "undocked"
sound = "lantern_near"
channel = "lantern_near"
fade = 1.0

[[events]]

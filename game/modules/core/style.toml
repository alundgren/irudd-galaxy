# The core's look, from the direction doc (game/docs/direction.md, 1.1, 1.2, 1.5 and 9).

# Calm dusky plum space, never near-black, so the warm ink reads against it; sparse warm
# stars and a few soft clouds of rose, amber, teal and violet haze.
[sky]
top = "#4e3672"
bottom = "#2a1f48"
stars = 180
# Far stars creep behind near ones as the ship flies: a little depth, kept faint.
star_layers = [0.25, 0.6, 1.1]
clouds = ["#c2577a", "#e8905a", "#2f8f8a", "#6b4aa0"]
cloud_count = 9
cloud_alpha = 0.2

# Warm dark plum ink, not black: a silhouette round every model, and inner lines on sharp
# creases and colour borders, so gentle rock facets stay bare.
[ink]
color = "#2a1a2e"
crease_degrees = 50
inner_px = 2.0

# One warm key light; shadows are violet (each look's `shadow`), never grey, and a hard
# warm rim catches the edges. Band edges fade over a few degrees so a turning rock never
# flips a face from one band to the next in a frame.
[light]
sun = "#fff1dc"
ambient = "#2c2240"
rim = "#ffb36b"
rim_strength = 0.55
band_fade_degrees = 30
# The slice's lower key light (about 31 degrees up), so rocks and buildings turn a real
# shadow side, where the violet tint and the hatching show.
sun_direction = [-0.62, 0.48, 0.52]

# Ink weight by the size of the thing: stations heaviest, then ships, rocks, props.
[looks.station]
outline_px = 4.5
hatch = 0.3
shadow = "#9e85cc"

[looks.ship]
outline_px = 3.5
hatch = 0.3
shadow = "#9e85cc"
# The engines and canopy are self-lit paint: a soft halo round them, not a bloom.
halo = 0.8
halo_size = 2.0

[looks.rock]
outline_px = 3.0
hatch = 1.0
# A lighter violet than the rest, so the ink strokes read on the rust-brown shadow side.
shadow = "#c8aef5"

# Effects, drawn only (scripts/cutter.luau and main.luau turn them on). Mining reads
# as one chain of cause and effect: the beam leaves the nose, lands on the rock in a
# spray of sparks and dust, chips of rust-brown stone come off the cut and fly back up
# the beam to the ship, and each unit landing in the hold puffs amber at the hold.

# The hand cutter: a short hot amber beam from the nose to the rock's surface. Its chips
# fly back up the beam just its length, so there are three: the cut close to the nose
# (under 1.5 units), within 3.5, and further (scripts/cutter.luau picks one).
[beams.cutter_near]
color = "#ffb36b"
width = 0.35
glow = 1.4
glow_size = 1.6
flicker = 0.2
flicker_rate = 6.0
impact = ["core.sparks", "core.chips_near", "core.dust"]

[beams.cutter]
color = "#ffb36b"
width = 0.35
glow = 1.4
glow_size = 1.6
flicker = 0.2
flicker_rate = 6.0
impact = ["core.sparks", "core.chips", "core.dust"]

[beams.cutter_far]
color = "#ffb36b"
width = 0.35
glow = 1.4
glow_size = 1.6
flicker = 0.2
flicker_rate = 6.0
impact = ["core.sparks", "core.chips_far", "core.dust"]

# The reach rig: a longer, steadier teal beam that pulls its chips the whole way in.
[beams.reach]
color = "#7fd6e0"
width = 0.45
glow = 1.2
glow_size = 1.8
flicker = 0.1
flicker_rate = 2.0
impact = ["core.sparks", "core.reach_chips", "core.dust"]

# Where the beam bites: bright short streaks thrown off the cut.
[particles.sparks]
shape = "spark"
blend = "add"
color = "#fff4dd"
end_color = "#ffb36b"
rate = 40.0
life = 0.3
speed = 9.0
spread = 150.0
direction = 0.0
size = 0.12
drag = 4.0

# Chips of stone: inked squares, warm where they were cut, that come off the cut and fly
# back up the beam to the ship's nose (direction 0 at a beam's landing is back up the
# beam), fading as they arrive: for a cut 1.5, 3 and 5 units off the nose.
[particles.chips_near]
shape = "chip"
blend = "paint"
color = "#f0a060"
end_color = "#b5653a"
rate = 16.0
life = 0.5
life_jitter = 0.15
speed = 3.2
speed_jitter = 0.15
spread = 30.0
direction = 0.0
size = 0.75
end_size = 0.4
drag = 0.0

[particles.chips]
shape = "chip"
blend = "paint"
color = "#f0a060"
end_color = "#b5653a"
rate = 16.0
life = 0.5
life_jitter = 0.15
speed = 6.0
speed_jitter = 0.15
spread = 30.0
direction = 0.0
size = 0.75
end_size = 0.4
drag = 0.0

[particles.chips_far]
shape = "chip"
blend = "paint"
color = "#f0a060"
end_color = "#b5653a"
rate = 16.0
life = 0.5
life_jitter = 0.15
speed = 10.0
speed_jitter = 0.15
spread = 30.0
direction = 0.0
size = 0.75
end_size = 0.4
drag = 0.0

# Each unit cut: a fistful of bigger stones breaks off and flies from the cut to the ship,
# one for each beam length (scripts/main.luau picks the one that matches the beam).
[particles.chunk_near]
shape = "chip"
blend = "paint"
color = "#ffb36b"
end_color = "#c06a3a"
count = 12
life = 0.55
life_jitter = 0.15
speed = 2.8
speed_jitter = 0.2
spread = 28.0
size = 1.05
end_size = 0.5
drag = 0.0

[particles.chunk]
shape = "chip"
blend = "paint"
color = "#ffb36b"
end_color = "#c06a3a"
count = 12
life = 0.55
life_jitter = 0.15
speed = 5.5
speed_jitter = 0.2
spread = 28.0
size = 1.05
end_size = 0.5
drag = 0.0

[particles.chunk_far]
shape = "chip"
blend = "paint"
color = "#ffb36b"
end_color = "#c06a3a"
count = 12
life = 0.55
life_jitter = 0.15
speed = 9.0
speed_jitter = 0.2
spread = 28.0
size = 1.05
end_size = 0.5
drag = 0.0

[particles.reach_chunk]
shape = "chip"
blend = "paint"
color = "#ffb36b"
end_color = "#c06a3a"
count = 12
life = 1.3
life_jitter = 0.15
speed = 6.2
speed_jitter = 0.2
spread = 28.0
size = 1.05
end_size = 0.5
drag = 0.0

# The rig's chips: the same stone, pulled the length of its longer beam.
[particles.reach_chips]
shape = "chip"
blend = "paint"
color = "#f0a060"
end_color = "#b5653a"
rate = 12.0
life = 1.3
life_jitter = 0.1
speed = 6.5
speed_jitter = 0.1
spread = 8.0
direction = 0.0
size = 0.7
end_size = 0.4
drag = 0.0

# A little rock dust hanging round the cut.
[particles.dust]
shape = "puff"
blend = "paint"
color = "#c98f4a"
end_color = "#8a6a8c"
rate = 7.0
life = 0.9
speed = 2.0
spread = 160.0
direction = 0.0
size = 0.8
end_size = 1.4
drag = 2.5

# A unit landing in the hold: an amber puff round the hold.
[particles.ore_in]
shape = "puff"
blend = "paint"
color = "#f2b43c"
end_color = "#e8905a"
count = 10
life = 0.45
speed = 3.0
spread = 360.0
size = 0.35
end_size = 0.15
drag = 3.0

# The hold full: a bigger ring of amber and a few warm sparks.
[particles.full]
shape = "puff"
blend = "paint"
color = "#ffcf6b"
end_color = "#f2b43c"
count = 28
life = 0.7
speed = 6.0
spread = 360.0
size = 0.5
end_size = 0.2
drag = 2.5

# A rock giving its last: a burst of inked pebbles and dust from where it stood.
[particles.rubble]
shape = "chip"
blend = "paint"
color = "#8f4a2a"
end_color = "#c98f4a"
count = 36
life = 1.4
speed = 6.0
spread = 360.0
size = 0.5
end_size = 0.3
drag = 1.6

# Exhaust: warm puffs from the engines while the ship thrusts, left behind as a trail.
[particles.exhaust]
shape = "puff"
blend = "paint"
color = "#ffcf6b"
end_color = "#c2577a"
rate = 30.0
life = 0.5
speed = 5.0
spread = 18.0
size = 0.35
end_size = 0.7
drag = 2.0

# Docking: a puff of cream vapour as the clamps take the ship, and again as it moors.
[particles.puff]
shape = "puff"
blend = "paint"
color = "#fff4dd"
end_color = "#cbb8e0"
count = 24
life = 0.8
speed = 4.0
spread = 360.0
size = 0.6
end_size = 1.1
drag = 2.5

[looks.prop]
outline_px = 2.5
hatch = 0.15
shadow = "#9e85cc"

[screen]
# The slice's screen family, light surfaces with pure black text throughout:
# parchment panels with an ink border for rooms, status, the log and the radio; cream
# paper for what just happened and the hint strip; mustard for anything you can press or
# pick up; white bubbles for speech; lantern-gold name signs on people.
paper = "#fff4dd"
panel = "#f7e8c8"
button = "#f2b43c"
bubble = "#ffffff"
sign = "#ffcf6b"
text = "#000000"
border = "#2a1a2e"
border_px = 2
radius = 12
# Amounts are text, so pure black like all text (direction doc 1.5 and 9); a gain or a
# loss shows by its sign and its word (Paid, Spent). A blue or vermilion mark beside a
# black amount needs a style the engine doesn't have yet (engine request 5).
gain = "#000000"
loss = "#000000"
# A building under the pointer lifts and takes the orange hover outline.
highlight = "#e69f00"
highlight_px = 5
# Dragging a part: the held card keeps the mustard of something you can pick up, an
# empty socket is hull cream with a dashed frame, and picking one up tints every target
# at once: sky blue with "Drop here", vermilion with "Cannot drop" and the reason.
held = "#f2b43c"
socket = "#efdcb4"
accept = "#8fcdef"
refuse = "#f4a27c"
track = "#efdcb4"
handle = "#9a6a3a"
handle_active = "#7a4e2a"

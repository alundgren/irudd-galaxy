[sky]
top = "#19283c"
bottom = "#697b86"
stars = 120
cloud_count = 3

[screen]
# One look per kind of thing, all with pure black text: cream paper for what just
# happened and for headings, pale blue panels for status and rooms, amber for anything
# you can press, white bubbles for speech.
paper = "#fbf3e0"
panel = "#d3e4ee"
button = "#f2b264"
bubble = "#ffffff"
text = "#000000"
border = "#3b2f2f"
radius = 8

[light]
ambient = "#49485e"
rim = "#efc287"
band_fade_degrees = 30

[looks.hull]
outline_px = 2
hatch = 0.25

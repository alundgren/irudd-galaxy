# The core's look, from the direction doc (game/docs/direction.md, 1.1, 1.2, 1.5 and 9).

# Calm dusky plum space, never near-black, so the warm ink reads against it; warm stars,
# most of them tiny, and soft layered clouds of rose, amber, teal and violet haze.
[sky]
top = "#4e3672"
bottom = "#2a1f48"
stars = 300
# Four layers: the farthest stars barely creep, the nearest slide past, so the backdrop
# has depth as the ship flies without ever looking busy.
star_layers = [0.12, 0.35, 0.75, 1.3]
# Violet listed twice, so the broad haze is mostly violet with rose, amber and teal
# patches over it.
clouds = ["#c2577a", "#6b4aa0", "#e8905a", "#2f8f8a", "#6b4aa0"]
cloud_count = 16
cloud_alpha = 0.24
# Depth (direction doc 1.2 and 3.3): far things sink into a violet haze a shade lighter
# than the sky's middle, so the farther a layer or landmark sits, the more of the sky's
# own colour it takes. Every layer is warm ink work, never a photographic starfield:
# hatching, soft dust and a few crisp warm specks, each sparse and low in contrast, so
# the backdrop has depth as the ship flies and never looks busy.
haze = "#43305f"
atmosphere = 0.55

# Farthest: long strokes of the plum ink, as if the sky itself were shaded with a pen.
# It barely creeps.
[[sky.layers]]
shape = "hatch"
parallax = 0.02
tint = "#2a1a2e"
alpha = 0.6
density = 0.3
size = [14.0, 26.0]
angle = 62.0
fade = 0.5

# Rose and violet dust, a little nearer: soft puffs in the clouds' own colours.
[[sky.layers]]
shape = "dust"
parallax = 0.06
tint = "#c2577a"
alpha = 0.16
density = 0.12
size = [10.0, 22.0]

[[sky.layers]]
shape = "dust"
parallax = 0.1
tint = "#8a6ac0"
alpha = 0.18
density = 0.16
size = [6.0, 14.0]

# Shorter, lighter violet hatching in the middle distance, crossing the far strokes.
[[sky.layers]]
shape = "hatch"
parallax = 0.18
tint = "#9a7ad0"
alpha = 0.5
density = 0.16
size = [7.0, 12.0]
angle = 52.0
fade = 0.6

# Warm motes nearer still: tiny peach and cream specks that slide past as the ship flies.
[[sky.layers]]
shape = "speck"
parallax = 0.38
tint = "#ffd8c2"
alpha = 0.45
density = 0.3
size = [0.6, 1.2]

# Nearest: a sparse lantern-gold dust that passes faster than the stars, so speed reads.
[[sky.layers]]
shape = "dust"
parallax = 0.62
tint = "#ffe9a8"
alpha = 0.16
density = 0.05
size = [1.5, 3.0]
fade = 0.5

# Landmarks, far away. A great dusky planet's limb rises out of the bottom-left corner,
# banded and hatched in its violet shadow and sunk deep in the haze, darker than any hull
# so a station in front of it still stands well clear (direction doc 1.2).
[[sky.landmarks]]
shape = "disc"
at = [-82.0, -74.0]
parallax = 0.015
size = 64.0
color = "#b0605a"
shadow = "#6a4a98"
hatch = 0.6
outline_px = 2.5
alpha = 0.85
fade = 1.3

# A rose nebula wash streaks across the upper left, behind the clouds.
[[sky.landmarks]]
shape = "wash"
at = [-46.0, 26.0]
parallax = 0.03
size = 52.0
stretch = 0.32
angle = 18.0
color = "#c2577a"
alpha = 0.5
hatch = 0.35

# A teal wash low on the left, smaller and fainter, so the two don't mirror each other.
[[sky.landmarks]]
shape = "wash"
at = [-60.0, -30.0]
parallax = 0.05
size = 30.0
stretch = 0.4
angle = -24.0
color = "#2f8f8a"
alpha = 0.35
hatch = 0.2

# A far station hangs deep in the haze to the north: another harbour, out of reach. It
# sits far back (it barely moves) and takes most of the haze, so it reads as a shape in
# the distance, never as a station the ship could fly to.
[[sky.landmarks]]
shape = "model"
model = "core.station"
look = "core.far"
at = [-6.0, 29.0]
parallax = 0.07
scale = 0.45
angle = 20.0
fade = 1.75

# Warm dark plum ink, not black: a silhouette round every model, and inner lines on sharp
# creases and colour borders, so gentle rock facets stay bare.
[ink]
color = "#2a1a2e"
crease_degrees = 50
inner_px = 2.0

# One warm key light; shadows are violet (each look's `shadow`), never grey, and a hard
# warm rim catches the edges. Band edges fade over a few degrees so a turning rock never
# flips a face from one band to the next in a frame.
[light]
sun = "#fff1dc"
ambient = "#2c2240"
rim = "#ffb36b"
rim_strength = 0.55
band_fade_degrees = 30
# The slice's lower key light (about 31 degrees up), so rocks and buildings turn a real
# shadow side, where the violet tint and the hatching show.
sun_direction = [-0.62, 0.48, 0.52]

# Ink weight by the size of the thing: stations heaviest, then ships, rocks, props.
# Lamps, windows and engines are self-lit paint; a halo makes them glow and pool light.
[looks.station]
outline_px = 4.5
hatch = 0.3
shadow = "#9e85cc"
halo = 1.1
halo_size = 2.2

[looks.ship]
outline_px = 3.5
hatch = 0.3
shadow = "#9e85cc"
# The engines and canopy are self-lit paint: a soft halo round them, not a bloom.
halo = 0.8
halo_size = 2.0

[looks.rock]
outline_px = 3.0
hatch = 1.0
# A lighter violet than the rest, so the ink strokes read on the rust-brown shadow side.
shadow = "#c8aef5"

# Effects, drawn only (scripts/cutter.luau and main.luau turn them on). Mining reads
# as one chain of cause and effect: the beam leaves the nose, lands on the rock in a
# spray of sparks and dust, chips of rust-brown stone come off the cut and fly back up
# the beam to the ship, and each unit landing in the hold puffs amber at the hold.

# The hand cutter: a short hot amber beam from the nose to the rock's surface. Its chips
# fly back up the beam just its length, so there are three: the cut close to the nose
# (under 1.5 units), within 3.5, and further (scripts/cutter.luau picks one).
[beams.cutter_near]
color = "#ffb36b"
width = 0.35
glow = 1.4
glow_size = 1.6
flicker = 0.2
flicker_rate = 6.0
impact = ["core.sparks", "core.chips_near", "core.cut_dust"]

[beams.cutter]
color = "#ffb36b"
width = 0.35
glow = 1.4
glow_size = 1.6
flicker = 0.2
flicker_rate = 6.0
impact = ["core.sparks", "core.chips", "core.cut_dust"]

[beams.cutter_far]
color = "#ffb36b"
width = 0.35
glow = 1.4
glow_size = 1.6
flicker = 0.2
flicker_rate = 6.0
impact = ["core.sparks", "core.chips_far", "core.cut_dust"]

# The reach rig: a longer, steadier teal beam that pulls its chips the whole way in.
[beams.reach]
color = "#7fd6e0"
width = 0.45
glow = 1.2
glow_size = 1.8
flicker = 0.1
flicker_rate = 2.0
impact = ["core.sparks", "core.reach_chips", "core.cut_dust"]

# A tow line: a thin brass line from a barge's bow to the ship, steady, with no glow to
# speak of, so it reads as rope and not as a cutting beam (scripts/salvage.luau).
[beams.tow]
color = "#e7b15a"
width = 0.3
glow = 0.25
glow_size = 0.5
flicker = 0.0
flicker_rate = 0.0

# Where the beam bites: bright short streaks thrown off the cut.
[particles.sparks]
shape = "spark"
blend = "add"
color = "#fff4dd"
end_color = "#ffb36b"
rate = 40.0
life = 0.3
speed = 9.0
spread = 150.0
direction = 0.0
size = 0.12
drag = 4.0

# Chips of stone: inked squares, warm where they were cut, that come off the cut and fly
# back up the beam to the ship's nose (direction 0 at a beam's landing is back up the
# beam), fading as they arrive: for a cut 1.5, 3 and 5 units off the nose.
[particles.chips_near]
shape = "chip"
blend = "paint"
color = "#f0a060"
end_color = "#b5653a"
rate = 16.0
life = 0.5
life_jitter = 0.15
speed = 3.2
speed_jitter = 0.15
spread = 30.0
direction = 0.0
size = 0.75
end_size = 0.4
drag = 0.0

[particles.chips]
shape = "chip"
blend = "paint"
color = "#f0a060"
end_color = "#b5653a"
rate = 16.0
life = 0.5
life_jitter = 0.15
speed = 6.0
speed_jitter = 0.15
spread = 30.0
direction = 0.0
size = 0.75
end_size = 0.4
drag = 0.0

[particles.chips_far]
shape = "chip"
blend = "paint"
color = "#f0a060"
end_color = "#b5653a"
rate = 16.0
life = 0.5
life_jitter = 0.15
speed = 10.0
speed_jitter = 0.15
spread = 30.0
direction = 0.0
size = 0.75
end_size = 0.4
drag = 0.0

# Each unit cut: a fistful of bigger stones breaks off and flies from the cut to the ship,
# one for each beam length (scripts/main.luau picks the one that matches the beam).
[particles.chunk_near]
shape = "chip"
blend = "paint"
color = "#ffb36b"
end_color = "#c06a3a"
count = 12
life = 0.55
life_jitter = 0.15
speed = 2.8
speed_jitter = 0.2
spread = 28.0
size = 1.05
end_size = 0.5
drag = 0.0

[particles.chunk]
shape = "chip"
blend = "paint"
color = "#ffb36b"
end_color = "#c06a3a"
count = 12
life = 0.55
life_jitter = 0.15
speed = 5.5
speed_jitter = 0.2
spread = 28.0
size = 1.05
end_size = 0.5
drag = 0.0

[particles.chunk_far]
shape = "chip"
blend = "paint"
color = "#ffb36b"
end_color = "#c06a3a"
count = 12
life = 0.55
life_jitter = 0.15
speed = 9.0
speed_jitter = 0.2
spread = 28.0
size = 1.05
end_size = 0.5
drag = 0.0

[particles.reach_chunk]
shape = "chip"
blend = "paint"
color = "#ffb36b"
end_color = "#c06a3a"
count = 12
life = 1.3
life_jitter = 0.15
speed = 6.2
speed_jitter = 0.2
spread = 28.0
size = 1.05
end_size = 0.5
drag = 0.0

# The rig's chips: the same stone, pulled the length of its longer beam.
[particles.reach_chips]
shape = "chip"
blend = "paint"
color = "#f0a060"
end_color = "#b5653a"
rate = 12.0
life = 1.3
life_jitter = 0.1
speed = 6.5
speed_jitter = 0.1
spread = 8.0
direction = 0.0
size = 0.7
end_size = 0.4
drag = 0.0

# A little rock dust hanging round the cut.
[particles.cut_dust]
shape = "puff"
blend = "paint"
color = "#c98f4a"
end_color = "#8a6a8c"
rate = 7.0
life = 0.9
speed = 2.0
spread = 160.0
direction = 0.0
size = 0.8
end_size = 1.4
drag = 2.5

# A unit landing in the hold: an amber puff round the hold.
[particles.ore_in]
shape = "puff"
blend = "paint"
color = "#f2b43c"
end_color = "#e8905a"
count = 10
life = 0.45
speed = 3.0
spread = 360.0
size = 0.35
end_size = 0.15
drag = 3.0

# The hold full: a bigger ring of amber and a few warm sparks.
[particles.full]
shape = "puff"
blend = "paint"
color = "#ffcf6b"
end_color = "#f2b43c"
count = 28
life = 0.7
speed = 6.0
spread = 360.0
size = 0.5
end_size = 0.2
drag = 2.5

# A rock giving its last: a burst of inked pebbles and dust from where it stood.
[particles.rubble]
shape = "chip"
blend = "paint"
color = "#8f4a2a"
end_color = "#c98f4a"
count = 36
life = 1.4
speed = 6.0
spread = 360.0
size = 0.5
end_size = 0.3
drag = 1.6

# Docking: a puff of cream vapour as the clamps take the ship, and again as it moors.
[particles.puff]
shape = "puff"
blend = "paint"
color = "#fff4dd"
end_color = "#cbb8e0"
count = 24
life = 0.8
speed = 4.0
spread = 360.0
size = 0.6
end_size = 1.1
drag = 2.5

# Ice: pale mint-cream with blue-violet shadow faces (direction doc 1.4), less hatched
# than ironstone so it reads smooth.
[looks.ice]
outline_px = 3.0
hatch = 0.55
shadow = "#8f8ee0"

# Glassite: its crystals are self-lit and glow a little.
[looks.glassite]
outline_px = 3.0
hatch = 0.8
shadow = "#b7a0f0"
halo = 0.7
halo_size = 1.6

[looks.prop]
outline_px = 2.5
hatch = 0.15
shadow = "#9e85cc"

# Lane buoys: props whose lamps glow, so the lane reads from afar.
[looks.buoy]
outline_px = 2.5
hatch = 0.15
shadow = "#9e85cc"
halo = 1.4
halo_size = 2.6

# Pebbles and grit: thin ink, so a drift reads as texture, not a field of rocks.
[looks.debris]
outline_px = 1.5
hatch = 0.4
shadow = "#c8aef5"

# Far things (a planet, a far lighthouse): faint ink, two bands, a shadow close to the
# sky's own violet, so they sit back in the haze.
[looks.far]
outline_px = 1.5
bands = 2
hatch = 0.0
shadow = "#6a5a9e"
halo = 1.6
halo_size = 3.0

# Engine trails: warm sparks that stay where they are born, so a moving hull draws a
# short fading line behind it.
[particles.exhaust]
shape = "dot"
blend = "add"
color = "#ffcf6b"
end_color = "#ee7a5a"
size = 0.55
end_size = 0.15
life = 0.7
rate = 30.0
speed = 2.0
spread = 18.0
direction = 180.0
drag = 3.0

# A trader's smaller, cooler trail.
[particles.wake]
shape = "dot"
blend = "add"
color = "#cff3ee"
end_color = "#6b4aa0"
size = 0.45
end_size = 0.1
life = 0.9
rate = 18.0
speed = 1.5
spread = 15.0
direction = 180.0
drag = 3.0

# Steam: slow cream cel puffs that swell and drift off a chimney or vent.
[particles.steam]
shape = "puff"
blend = "paint"
color = "#fff4dd"
end_color = "#b9a6d9"
size = 0.5
end_size = 1.8
life = 3.5
life_jitter = 0.3
rate = 3.0
speed = 1.4
speed_jitter = 0.4
spread = 40.0
drag = 0.6

# A distress flare off a barge adrift: slow rose puffs all round her hull that fade, every
# few seconds, so she can be found without anything flashing and her label never hides
# them (scripts/tow.luau).
[particles.flare]
shape = "puff"
blend = "paint"
color = "#ff9bb0"
end_color = "#ffe3a0"
count = 14
size = 1.3
end_size = 3.4
life = 3.0
life_jitter = 0.3
speed = 3.6
speed_jitter = 0.5
spread = 360.0
drag = 0.6

# Welding off a barge being mended: a few short sparks now and then.
[particles.weld]
shape = "spark"
blend = "add"
color = "#ffd36b"
end_color = "#ff7a2e"
rate = 18.0
life = 0.6
speed = 8.0
spread = 180.0
size = 0.55
drag = 2.0

# Dust: a few faint warm motes drifting over the rock drifts.
[particles.dust]
shape = "dot"
blend = "add"
color = "#ffe9a8"
end_color = "#6b4aa0"
size = 0.16
end_size = 0.08
life = 4.0
life_jitter = 0.5
rate = 2.5
speed = 1.2
speed_jitter = 0.8
spread = 360.0
drag = 0.2

[screen]
# The core's screen kit (direction doc 1.5, 4 and 9). Each kind of thing has its own
# look, so a glance tells status from place from speech from receipt:
#   status and hints are dark ink with lantern gold; places and trade are parchment;
#   speech is a white bubble with an amber name tag; receipts are dark tickets with a
#   gold CONFIRMED tag; anything you can press is mustard.
# Text is pure black on light and pure white on dark. State colours (direction doc 9)
# only ever mark a shape beside black or white words: blue for a gain, vermilion for a
# loss or a warning, orange for hover, sky blue for a socket that takes the part.
# The looks are named below; scripts pick them through scripts/kit.luau (see README).
paper = "#fff4dd"
panel = "#f7e8c8"
button = "#f2b43c"
button_hover = "#ffcf6b"
bubble = "#ffffff"
sign = "#ffcf6b"
text = "#000000"
border = "#2a1a2e"
border_px = 2
radius = 12
# A resting button: the parchment with a dashed ink frame, never greyed out.
resting = "#f7e8c8"
# Amounts are text, so pure black like all text; a gain or a loss shows by its sign,
# its word and a blue or vermilion mark beside it (kit.amount).
gain = "#000000"
loss = "#000000"
# Talk bubbles: white with an ink frame, the speaker's name on an amber tag.
bubble_look = "bubble"
bubble_title_look = "name_tag"
sign_look = "sign"
# A building under the pointer lifts and takes the orange hover outline.
highlight = "#e69f00"
highlight_px = 5
# Dragging a part: the held card keeps the mustard of something you can pick up, an
# empty socket is hull cream with a dashed frame, and picking one up tints every target
# at once: sky blue with "Drop here", vermilion with "Cannot drop" and the reason.
held = "#f2b43c"
socket = "#efdcb4"
accept = "#8fcdef"
refuse = "#f4a27c"
track = "#efdcb4"
handle = "#9a6a3a"
handle_active = "#7a4e2a"
# Motion: short and calm. Panels fade in over a sixth of a second with a small rise and
# fade out a little quicker; a button lifts a pixel and a half under the pointer and
# sinks as much when pressed; a changed amount flashes pale gold for half a second.
motion_in = 0.16
motion_out = 0.12
motion_slide = 8
hover_lift = 1.5
press_sink = 1.5
cue_time = 0.5
flash = "#ffe9a6"

# Status: the HUD chip, top right. Dark ink, lantern-gold border.
[screen.looks.chip]
fill = "#2a1a2e"
text = "#ffffff"
border = "#f2b43c"
border_px = 2
radius = 12
pad = 12
shadow = 4
flash = "#5a4466"

# A key hint: a dark ink pill with a thin gold frame, quieter than the chip.
[screen.looks.pill]
fill = "#2a1a2e"
text = "#ffffff"
border = "#c9963a"
border_px = 1
radius = 22
pad = 10
flash = "#5a4466"

# A key in a hint: the key's name heavy white with a gold rule, so the strip reads
# "key · what it does" at a glance.
[screen.looks.key]
text = "#ffffff"
weight = 700
underline = "#f2b43c"

# The station's plate, top left while docked: dark ink like the status, with a thin
# gold frame, so the name never reads as a meter or a place panel.
[screen.looks.plate]
fill = "#2a1a2e"
text = "#ffffff"
border = "#c9963a"
border_px = 1
radius = 12
pad = 10
shadow = 4

# A name on a dark surface (the station on its plate): heavy white.
[screen.looks.plate_name]
text = "#ffffff"
weight = 700

# A place: the room panel, parchment with an ink frame and a soft shadow.
[screen.looks.place]
fill = "#f7e8c8"
text = "#000000"
border = "#2a1a2e"
border_px = 2
radius = 14
pad = 16
shadow = 6

# A figure in running text (a price, a count): heavy black.
[screen.looks.figure]
text = "#000000"
weight = 700

# A place's heading: large and heavy.
[screen.looks.heading]
text = "#000000"
weight = 700

# The trade table: a lighter sheet inside the place panel, one row per ware.
[screen.looks.table]
fill = "#fff4dd"
text = "#000000"
border = "#c9a878"
border_px = 1
radius = 8
pad = 8

# A table's column heads: small, heavy and ruled.
[screen.looks.column]
text = "#000000"
weight = 700
underline = "#2a1a2e"

# A receipt: a dark ticket for what was given and got.
[screen.looks.ticket]
fill = "#2a1a2e"
text = "#ffffff"
border = "#2a1a2e"
border_px = 0
radius = 6
pad = 10
flash = "#5a4466"

# The tag on a receipt: gold, black capitals.
[screen.looks.confirmed]
border_px = 0
fill = "#f2b43c"
text = "#000000"
weight = 700
radius = 4
pad = 4

# A notice: a place changed. Sky blue tag, so it never reads as a receipt.
[screen.looks.notice]
border_px = 0
fill = "#8fcdef"
text = "#000000"
weight = 700
radius = 4
pad = 4

# The log button's "N new": blue, white words (direction doc 9).
[screen.looks.new]
border_px = 0
fill = "#0072b2"
text = "#ffffff"
weight = 700
radius = 4
pad = 4

# A kind word on a log line (JOB, OFFER, VISIT, FLIGHT): ink capitals on a cream tag.
[screen.looks.kind]
border_px = 0
fill = "#efdcb4"
text = "#000000"
weight = 700
radius = 4
pad = 4

# Speech: a white bubble with an ink frame.
[screen.looks.bubble]
fill = "#ffffff"
text = "#000000"
border = "#2a1a2e"
border_px = 2
radius = 14
shadow = 4

# The speaker's name: an amber tag over the bubble, black and heavy.
[screen.looks.name_tag]
border_px = 0
fill = "#f2b43c"
text = "#000000"
weight = 700
radius = 6
pad = 4

# A name in running text: heavy, with an amber rule under it.
[screen.looks.name]
text = "#000000"
weight = 700
underline = "#b07800"

# A quieter word beside a name (a role, a place).
[screen.looks.quiet]
text = "#000000"
weight = 400

# A keeper's name sign: lantern gold with an ink frame.
[screen.looks.sign]
fill = "#ffcf6b"
text = "#000000"
border = "#2a1a2e"
border_px = 2
radius = 8

# A world label (a trader or station name in flight): a small dark tag.
[screen.looks.label]
border_px = 0
fill = "#2a1a2e"
text = "#ffffff"
weight = 600
radius = 6
pad = 4

# Buttons. Primary is the base mustard (no look needed). Secondary is parchment with an
# ink frame, for "Back", "Close", paging and quiet choices. Resting is the base resting
# button (resting = "<reason>" on a button).
[screen.looks.primary]
fill = "#f2b43c"
text = "#000000"
border = "#2a1a2e"
border_px = 2
radius = 10
hover = "#ffcf6b"

[screen.looks.secondary]
fill = "#fff4dd"
text = "#000000"
border = "#2a1a2e"
border_px = 2
radius = 10
hover = "#f7e8c8"

# A dark button on a dark surface (the radio's controls).
[screen.looks.dark_button]
fill = "#3d2c44"
text = "#ffffff"
border = "#c9963a"
border_px = 1
radius = 10
hover = "#5a4466"

# The radio: a slim dark strip, quieter than the status chip.
[screen.looks.radio]
fill = "#2a1a2e"
text = "#ffffff"
border = "#5a4466"
border_px = 1
radius = 12
pad = 8
shadow = 3
flash = "#5a4466"

# A warning: pale vermilion with a vermilion frame and black words.
[screen.looks.warning]
fill = "#fde3d3"
text = "#000000"
border = "#d55e00"
border_px = 2
radius = 8
pad = 8

# Gain and loss marks: a shape in blue or vermilion beside a black amount.
[screen.looks.gain]
text = "#0072b2"
mark = true

[screen.looks.loss]
text = "#d55e00"
mark = true

# On a dark surface the same marks in lighter tints, still 3:1.
[screen.looks.gain_dark]
text = "#56b4e9"
mark = true

[screen.looks.loss_dark]
text = "#ff8a4c"
mark = true

# Signal bars on the radio: lit gold, unlit dim.
[screen.looks.lit]
text = "#f2b43c"
mark = true

[screen.looks.unlit]
text = "#7a6683"
mark = true

# The core module: the base game. It is written through the GM (game/AGENTS.md).
id = "core"
version = "0.1.0"
min_engine_version = "0.5.0"
scripts = ["scripts/main.luau", "scripts/station.luau", "scripts/hud.luau", "scripts/talk.luau"]
events = ["ahead", "back", "left", "right", "boost", "mine", "dock", "cancel", "open", "close", "launch", "sell", "log", "mined", "sold", "docked"]
writes = ["engine.position", "engine.motion", "engine.flight", "engine.helm", "engine.steer", "engine.body", "engine.camera", "engine.model", "engine.being", "engine.location", "engine.place", "engine.room", "engine.spot", "engine.walk", "engine.anchor", "engine.talk", "engine.talk_line", "engine.life", "engine.act", "engine.clock"]

[components.pilot]
cargo = "int"
credits = "int"
mining = "bool"
target = "id"
station = "id"
room = "id"
sale = "int"
message = "text"
logged = "int"
log_open = "bool"

[components.held]
ahead = "bool"
back = "bool"
left = "bool"
right = "bool"
boost = "bool"

[components.ore]
left = { type = "int", default = 12 }
total = { type = "int", default = 12 }

[components.port]
name = "text"
price = "int"
stock = "int"
berth = "id"
departure = "id"
exchange = "id"

[components.facility]
station = "id"
name = "text"
keeper = "id"
offer = "text"
order = "int"

[components.keeper]
name = "text"

[components.skiff]
a = "id"
b = "id"

[components.entry]
n = "int"
text = "text"
talk = "id"
# A conversation still being heard: its next lines join this entry.
open = "bool"

# How often the player has used each control; its hint retires after a few uses.
[components.taught]
thrust = "int"
turn = "int"
boost = "int"
mine = "int"
dock = "int"
cancel = "int"
talk = "int"

[keys]
w = "ahead"
s = "back"
a = "left"
d = "right"
shift = "boost"
space = "mine"
e = "dock"
0 = "cancel"
m = "open"
b = "close"
u = "launch"
enter = "sell"
l = "log"

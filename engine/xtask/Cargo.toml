[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The bin target's name is engine-only while the slice exists (see the workspace Cargo.toml).
autobins = false

[[bin]]
name = "engine-xtask"
path = "src/main.rs"

[dependencies]
directories.workspace = true
galaxy-module.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
zip.workspace = true

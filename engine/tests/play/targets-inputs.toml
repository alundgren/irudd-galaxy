# Glide into the hall, hover and click both figures, glide between camera nodes, land a
# glide with a click, go back with Esc and right-click, then shrink the window.
# Run for 210 ticks.

[[click]]
tick = 5
widget = "enter"

[[note]]
tick = 15
text = "Mid-glide into the hall, no fade"

[[pointer]]
tick = 35
action = "move"
widget = "first-target"

[[note]]
tick = 37
text = "Hovering the first figure: lifted, outlined, hand pointer"

[[click]]
tick = 40
widget = "first-target"

[[note]]
tick = 48
text = "Mid-glide to the first figure"

[[click]]
tick = 50
widget = "point:640,360"

[[note]]
tick = 53
text = "The click landed the glide"

[[key]]
tick = 60
key = "escape"

[[click]]
tick = 90
widget = "second-target"

[[key]]
tick = 120
key = "mouse_right"

[[resize]]
tick = 150
width = 1024
height = 576

[[note]]
tick = 152
text = "Edge widgets at 1024x576"

[[key]]
tick = 160
key = "escape"

[[note]]
tick = 200
text = "Back in the yard"

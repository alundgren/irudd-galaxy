# A generic kit of screen looks: parchment panels with black text, a dark chip with
# white text, a tag, a name mark and a gain mark, with short UI motion.
[screen]
paper = "#fff8e8"
panel = "#f7e8c8"
button = "#f2b43c"
button_hover = "#ffd257"
text = "#000000"
gain = "#000000"
loss = "#000000"
border = "#3a2a1a"
bubble = "#ffffff"
sign = "#fff8e8"
resting = "#fff8e8"
radius = 14.0
border_px = 2.0
bubble_title_look = "name"
motion_in = 0.22
motion_out = 0.18
motion_slide = 18.0
hover_lift = 2.0
press_sink = 2.0
cue_time = 0.6
flash = "#ffe9a6"

[screen.looks.parchment]
fill = "#f7e8c8"
text = "#000000"
border = "#3a2a1a"
border_px = 2.0
radius = 16.0
shadow = 6.0

[screen.looks.chip]
fill = "#1f1a24"
text = "#ffffff"
border = "#f2b43c"
border_px = 2.0
radius = 12.0
pad = 12.0
shadow = 6.0
flash = "#3d3346"

[screen.looks.ticket]
fill = "#1f1a24"
text = "#ffffff"
pad = 6.0
radius = 6.0
weight = 600.0

[screen.looks.name]
text = "#000000"
weight = 700.0
underline = "#b07800"

[screen.looks.gain]
text = "#0072b2"
mark = true

# Depth in the sky, kept quiet and in the plum-and-warm-ink palette: the further a thing
# is, the slower it slides and the more it sinks into the haze. The camera shows 36
# world units; landmarks are placed and sized in world units, marks in logical pixels.
[sky]
top = "#4e3672"
bottom = "#2a1f48"
stars = 160
star_layers = [0.25, 0.6]
cloud_count = 10
haze = "#3d2b5e"
atmosphere = 0.55

# The farthest: faint violet hatching, nearly still.
[[sky.layers]]
shape = "hatch"
parallax = 0.02
tint = "#6b4aa0"
alpha = 0.45
density = 0.35
size = [10.0, 18.0]
angle = 60.0

# Rose dust, a little nearer.
[[sky.layers]]
shape = "dust"
parallax = 0.08
tint = "#c2577a"
alpha = 0.35
density = 0.5
size = [2.0, 5.0]

# Warm specks in the middle distance.
[[sky.layers]]
shape = "speck"
parallax = 0.22
tint = "#ffd8c2"
alpha = 0.75
density = 0.35
size = [0.6, 1.3]

# Small rocks drifting between the far sky and the field.
[[sky.layers]]
shape = "model"
parallax = 0.45
model = "sky.rock"
look = "sky.far"
density = 0.03
size = [0.35, 0.7]

# A terracotta planet's limb, top left.
[[sky.landmarks]]
shape = "disc"
at = [-30.0, 16.0]
parallax = 0.03
size = 16.0
color = "#d9774b"
shadow = "#7d62b8"
outline_px = 3.0
hatch = 0.5

# A teal nebula wash across the lower right.
[[sky.landmarks]]
shape = "wash"
at = [16.0, -10.0]
parallax = 0.05
size = 26.0
stretch = 0.3
angle = 20.0
color = "#2f8f8a"
alpha = 0.5
hatch = 0.6

# A far hub's silhouette in the middle distance.
[[sky.landmarks]]
shape = "model"
at = [24.0, 12.0]
parallax = 0.3
model = "sky.hub"
look = "sky.far"
scale = 0.55
angle = 30.0

[looks.hull]
outline_px = 3.5
hatch = 0.25

[looks.rock]
outline_px = 3.0
hatch = 0.85

[looks.prop]
outline_px = 2.5
hatch = 0.12

# Distant things: thinner ink, more hatching.
[looks.far]
outline_px = 2.0
hatch = 0.6

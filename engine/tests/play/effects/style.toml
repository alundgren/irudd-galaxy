# How effects are drawn. Lamps and the ship's engine glow through their looks' halos; the
# cutter throws additive sparks and inked chips where it lands; the exhaust is a soft
# trail that stays where it was sprayed; docking puffs inked smoke.
[looks.hull]
outline_px = 3.5
hatch = 0.25
halo = 1.0

[looks.lamp]
outline_px = 2.5
hatch = 0.12
halo = 1.4
halo_size = 3.0

[looks.rock]
outline_px = 3.0
hatch = 0.85

[looks.prop]
outline_px = 2.5
hatch = 0.12

[beams.cutter]
color = "#7ff0d8"
width = 0.45
glow = 1.2
glow_size = 1.5
flicker = 0.2
flicker_rate = 1.5
impact = ["effects.sparks", "effects.chips"]

[particles.sparks]
shape = "spark"
blend = "add"
color = "#fff0b0"
end_color = "#ff8a3c"
rate = 50.0
life = 0.5
speed = 10.0
spread = 120.0
size = 0.3
end_size = 0.1
drag = 2.5

[particles.chips]
shape = "chip"
blend = "paint"
color = "#b0663c"
end_color = "#7a4a3a"
rate = 8.0
life = 0.9
speed = 4.0
spread = 100.0
size = 0.45
end_size = 0.25
drag = 1.5

[particles.exhaust]
shape = "dot"
blend = "add"
color = "#ffcf6b"
end_color = "#e8605a"
rate = 120.0
life = 0.6
life_jitter = 0.3
speed = 3.0
speed_jitter = 0.4
spread = 24.0
size = 1.3
end_size = 0.5
drag = 1.0

[particles.puff]
shape = "puff"
blend = "paint"
color = "#f7e8c8"
end_color = "#c8aef5"
count = 18
life = 0.8
speed = 5.0
speed_jitter = 0.6
spread = 360.0
size = 0.9
end_size = 1.6
drag = 3.0

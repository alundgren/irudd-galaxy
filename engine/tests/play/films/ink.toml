# No edge-stepping events on the hub: cover both inner ink and silhouettes.
# The dock film used to find 12 events on its model with single-sample ink.
# GPU-only: galaxy-gm motion check tests/play/films/ink.toml
modules = "../drift"
inputs = "inputs/dock.toml"
from = 0
to = 180
fps = 60
size = "1280x720"

[[expect]]
tool = "flicker"
near = "hub"
value = "near_split.on_model"
at_most = 0

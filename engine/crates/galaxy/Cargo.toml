[package]
name = "galaxy"
description = "The game: runs modules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The bin target's name is engine-only while the slice exists (see the workspace Cargo.toml).
autobins = false

[[bin]]
name = "engine-galaxy"
path = "src/main.rs"

[dependencies]
galaxy-api.workspace = true
galaxy-module.workspace = true
galaxy-sim.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package]
name = "galaxy"
description = "The game: runs modules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The bin target's name is engine-only while the slice exists (see the workspace Cargo.toml).
autobins = false

[[bin]]
name = "engine-galaxy"
path = "src/main.rs"

[dependencies]
arboard.workspace = true
galaxy-api.workspace = true
galaxy-audio.workspace = true
galaxy-live.workspace = true
hound.workspace = true
galaxy-module.workspace = true
galaxy-motion.workspace = true
galaxy-render.workspace = true
galaxy-sim.workspace = true
galaxy-view.workspace = true
serde_json.workspace = true
winit.workspace = true

# The play window's message hook (src/window_scale.rs). The version winit itself uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
galaxy-mesh.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

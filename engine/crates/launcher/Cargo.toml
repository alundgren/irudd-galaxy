[package]
name = "galaxy-launcher"
description = "The galaxy and galaxy-gm launchers: run the right installed build"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The bin target's name is engine-only while the slice exists (see the workspace Cargo.toml).
autobins = false

[[bin]]
name = "engine-launcher"
path = "src/main.rs"

[dependencies]
galaxy-module.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

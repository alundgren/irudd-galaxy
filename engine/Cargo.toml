[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

# The engine version. Every crate, both binaries and their launchers share it, and a
# module's `min_engine_version` is compared with it. A release bumps it (see
# docs/modules-and-install.md).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Binary target names. Cargo names binaries without a hash (`deps/<name>.exe`), and the
# engine shares its build slots with the frozen slice, so an engine binary named like a
# slice one (`galaxy`, `xtask`) would silently overwrite it, and the other workspace would
# run the wrong program while thinking it is up to date. So every engine bin target has an
# `engine-` name no slice bin or example uses: engine-galaxy, engine-galaxy-gm,
# engine-launcher, engine-xtask. `cargo xtask install` copies them under their public
# names (`galaxy`, `galaxy-gm`). The names go back once the slice is deleted.

# Shared dependency versions. Add new ones here and use `dep.workspace = true` in crates.
[workspace.dependencies]
# Our crates
galaxy-module = { path = "crates/module" }

# Third party (all MIT or MIT/Apache-2.0)
directories = "6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.1.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "warn"

# Dev builds: our code is lightly optimised, dependencies are optimised once and cached.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1

# Release, which `cargo xtask install` uses: thin LTO only. Never fat LTO; build time
# matters more than the last few percent.
[profile.release]
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

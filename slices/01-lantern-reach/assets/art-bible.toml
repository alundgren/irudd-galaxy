# Art bible for the Lantern Reach kit.
#
# The renderer loads this file and checks station recipes against it. Colours are
# sRGB hex. Lightness is OKLab L (0 is black, 1 is white). Chroma is the OKLab
# distance from grey. The sky stays coloured, the ink is warm and not black, and
# paint is never neutral grey or blue-grey chrome.

[ink]
color = "#2a1a2e"
# Silhouette weight in logical pixels, [min, max]. The kit uses the midpoint.
station_px = [4.0, 5.0]
ship_px = [3.0, 4.0]
rock_px = [2.5, 3.5]
prop_px = [2.0, 3.0]
# Inner crease lines, about half a silhouette.
inner_px = [1.5, 2.5]
# Edges sharper than this (degrees) get an inner line. Gentler rock facets stay bare.
crease_degrees = 50.0
# Linear-RGB distance between neighbouring paint that counts as a colour border.
color_edge = 0.22
# View-depth jump, in world units, that inks a step whose normals still agree.
depth_step = 0.55

[hatch]
station = 0.35
ship = 0.22
rock = 0.85
prop = 0.12

[ranges]
hull_l = [0.55, 0.96]
trim_l = [0.14, 0.86]
accent_l = [0.14, 0.92]
glow_l = [0.50, 1.0]
glass_l = [0.40, 0.97]
leaf_l = [0.18, 0.86]
# Enough colour to refuse grey chrome, not so much the hull fluoresces.
chroma = [0.018, 0.24]
glow_chroma = [0.04, 0.34]
# A hull stays this far above the lighter end of its region's sky, in OKLab L.
hull_above_sky = 0.22
# How near a palette slot must be to a faction swatch to count as carrying it.
faction_distance = 0.16

[budget]
min_parts = 1
max_parts = 48
max_decals = 12
max_of_kind = 8

[budget.kind]
hub = 2
docking_ring = 2
arm = 8
greenhouse = 4
antenna = 6

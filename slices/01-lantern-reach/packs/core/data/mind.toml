# The fast-model layer (galaxy-mind): models, limits, budgets and NPC briefs.
# Every number is a starting value of tunable pack data. The game master will set
# briefs and budgets through the Mind hook later. Briefs follow content/05-people.md
# (NPCs) and content/02-economy.md (NPC traders).

[models]
decision = "typesafe/jev-1.14"
line = "openai/gpt-oss-20b"

[limits]
# Ticks the sim waits for an answer before taking the utility default (300 = 10 s
# at the nominal 30 ticks/s; ticks stop while paused). Measured: Jev answers in
# 0.2 to 0.4 s, gpt-oss lines in 2.6 to 9.3 s.
deadline_ticks = 300
max_in_flight = 8
menu_size = 4
packet_facts = 12
packet_bytes = 24000
timeout_ms = 8000
line_max_tokens = 600

[budget]
# Hard cap for the whole save, in US dollars.
spend_cap_usd = 1.0

# Calls per window per region; the window is counted in the player's dockings, so
# the layer spends where the player is active. Nothing refills on a clock.
[budget.default]
calls = 30
window_dockings = 10
spend_cap_usd = 0.25

[budget.region."region.lantern_shallows"]
calls = 40
window_dockings = 10
spend_cap_usd = 0.30

[budget.region."region.cinder_drift"]
calls = 30
window_dockings = 10
spend_cap_usd = 0.25

[budget.region."region.brassmouth_narrows"]
calls = 30
window_dockings = 10
spend_cap_usd = 0.25

[talk]
pick = true
phrase = true
max_words = 20
max_chars = 160
# Canon only the game master touches. No fast-model line may contain these.
forbidden = ["Ancients", "Ancient", "precursor", "canon"]


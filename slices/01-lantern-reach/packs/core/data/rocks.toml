# Rock types and fields. PROVISIONAL numbers: the content spec replaces them.
# Rocks are generated once at new game from each field, with stable IDs
# <rock_prefix>.01, .02, ... and a layout keyed by the field ID (not the seed).
# regrowth is units per regrowth step; W2 defines the step from activity, never a clock.
# Schema: crates/contract/schemas/data-rocks.json


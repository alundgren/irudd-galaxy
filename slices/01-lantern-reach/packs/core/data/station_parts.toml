# Station parts (issue #47, 3.1; the station concept's direction A). A station is a list
# of parts. Each is a room of a kind the game shows (market, wharf, dockmaster, notice_wall,
# canteen, greenhouse, berths, counter), drawn as a module bolted onto a free anchor of the
# station's kit recipe (crates/kit/src/station.rs `anchors`), with a keeper and a hanging
# sign (one line of what it offers). Hovering a module shows its keeper and sign; clicking
# it opens the room beside it.
#
# Fields: `name` (optional) names a counter on its sign and key icon. `module` is an asset-kit kind (`MODULE_KINDS`: block, banner, crane, dome, tank,
# cargo_pod, docking_arm, greenhouse, lamp_mast) and the art bible's budget applies.
# `state` is open, closed (a scaffold and a closed sign) or building (a scaffold and a
# dashed sign). `line` is the keeper's line about the part as it is now; `rollback_line`
# is what they say if it's taken away. The keeper is a person at the station, from
# npcs.toml, and their talk bubbles rise from this module. Packs change parts at a calm
# moment with `ctx.parts` (crates/contract/api/HOOKS.md).
#
# Every station has a market and a dockmaster's office; Lantern Wharf has the wharf.
# Schema: crates/contract/schemas/data-station-parts.json

# --- Lantern Wharf ---------------------------------------------------------------------

[[part]]
id = "part.wharf.office"
station = "station.lantern_wharf"
room = "dockmaster"
module = "block"
anchor = "quay.west"
keeper = "npc.ilse_marrow"
sign = "Ilse Marrow keeps the berths"
rollback_line = "I've moved my desk to the hub for now. Ask me anything there."

[[part]]
id = "part.wharf.market"
station = "station.lantern_wharf"
room = "market"
module = "banner"
anchor = "quay.north"
keeper = "npc.ilse_marrow"
sign = "Ice and ore bought, plate sold"
rollback_line = "I've folded the stalls away. I'll still buy what you bring."

[[part]]
id = "part.wharf.wharf"
station = "station.lantern_wharf"
room = "wharf"
module = "docking_arm"
anchor = "pier.south"
keeper = "npc.orrin_vale"
sign = "Orrin fits parts in the cradle"
rollback_line = "I've taken the cradle arm down. Your locker stays yours."


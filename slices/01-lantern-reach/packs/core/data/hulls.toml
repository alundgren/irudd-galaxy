# Hulls. PROVISIONAL numbers from the content spec (content/03-ships-and-controls.md).
# Speeds are world units per second, turn rates degrees per second and mining rates
# units per second at hardness 1.0, all at the nominal 30 ticks per second.
# accel and brake (u/s^2) are optional: without accel a hull reaches top speed in
# ship_rules.toml's flight.accel_time, and without brake it brakes at accel times
# flight.brake.
#
# The hulls the player flies by hand use the locked flight preset (issue #47), tuned
# in prototypes/flight-lab and carried over at 1 lab px = 0.55 u, which keeps the
# lab's on-screen feel at the game's zoom 0.80: the Wren tops out at 165 u/s
# (300 px/s), thrusts at 247.5 u/s^2 (450 px/s^2), brakes at 192.5 u/s^2
# (350 px/s^2) and turns at 180 deg/s. The Tandem and the Heron keep their old
# character relative to the Wren on the same scale (speed x2.29, turn x0.67, accel
# 1.5 x speed, brake 1.17 x speed). Craft that fly only by orders keep their speeds.
# Schema: crates/contract/schemas/data-hulls.json

# A good little ship: the player's first.
[[hull]]
id = "hull.wren"
name = "Wren"
tier = 0
hold_capacity = 20
max_speed = 165.0
accel = 247.5
brake = 192.5
turn_rate = 180.0
mining_rate = 1.0

# Hearthbound branch: hauler that pairs with automation.
[[hull]]
id = "hull.tandem"
name = "Tandem"
tier = 1
hold_capacity = 40
max_speed = 115.0
accel = 172.5
brake = 134.0
turn_rate = 107.0
mining_rate = 1.0
# The Coupling: hands cargo to the player's tenders (the `transfer` verb).
coupling = true

# Hearthbound branch: scout with longer price reach.
[[hull]]
id = "hull.heron"
name = "Heron"
tier = 1
hold_capacity = 16
max_speed = 179.0
accel = 268.5
brake = 209.0
turn_rate = 220.0
mining_rate = 0.8
# Long glass: live prices for the whole region; a lane arrival refreshes the
# snapshots of every station in the new region.
price_reach = { region = true, lane_scout = true }

# The first automated craft. Its standing berth lets it wait docked for a price.
[[hull]]
id = "hull.tender"
name = "Tender"
tier = 0
hold_capacity = 24
max_speed = 45.0
turn_rate = 180.0
mining_rate = 0.5
standing_berth = true

# What each hull the player flies takes from the hullwright (ship_parts.toml): its
# sockets, its power cap (what its parts may draw at once) and the mass it carries
# without slowing. Hulls without a [[fit]] take no parts.
[[fit]]
hull = "hull.wren"
sockets = ["socket.drill", "socket.utility", "socket.rack", "socket.hold", "socket.engine"]
power = 4
free_mass = 3

# The hauler: room for weight, and a drone bay for bigger automation.
[[fit]]
hull = "hull.tandem"
sockets = ["socket.drill", "socket.utility", "socket.rack", "socket.hold", "socket.engine", "socket.bay"]
power = 5
free_mass = 6

[[fit]]
hull = "hull.heron"
sockets = ["socket.drill", "socket.utility", "socket.rack", "socket.hold", "socket.engine"]
power = 5
free_mass = 2

# Hull ranks (W4, content/03-ships-and-controls.md "Hull ranks"): deeds done in the hull,
# counted from facts since the player started flying it. Shown as painted lantern
# stripes, never a number. Prestige resets them; the old hull's ranks stay on record.
[[rank]]
hull = "hull.wren"
rank = 1
name = "Settled"
deed = { facts = { kind = "dock", ship = "ship.player" } }
at_least = 25
effect = "Turn +10%"
modifiers = [{ modifier = "turn_rate", factor = 1.1 }]

[[rank]]
hull = "hull.wren"
rank = 2
name = "Worn in"
deed = { sum = { kind = "sell", ship = "ship.player" } }
at_least = 300
effect = "Hold +2"
modifiers = [{ modifier = "hold", units = 2 }]

[[rank]]
hull = "hull.wren"
rank = 3
name = "Known by the lanes"
deed = { facts = { kind = "jump", ship = "ship.player" } }
at_least = 20
effect = "Speed +5%"
modifiers = [{ modifier = "speed", factor = 1.05 }]

[[rank]]
hull = "hull.tandem"
rank = 1
name = "Steady"
deed = { facts = { kind = "dock", ship = "ship.player" } }
at_least = 25
effect = "Turn +10%"
modifiers = [{ modifier = "turn_rate", factor = 1.1 }]

[[rank]]
hull = "hull.tandem"
rank = 2
name = "Broad-backed"
deed = { sum = { kind = "sell", ship = "ship.player" } }
at_least = 400
effect = "Hold +4"
modifiers = [{ modifier = "hold", units = 4 }]

# Transfers to a tender (the Coupling's `transfer` verb, W2).
[[rank]]
hull = "hull.tandem"
rank = 3
name = "Good company"
deed = { facts = { kind = "transfer", ship = "ship.player" } }
at_least = 10
effect = "Each tender's hold +4"
modifiers = [{ modifier = "tender_hold", units = 4 }]

[[rank]]
hull = "hull.heron"
rank = 1
name = "Steady"
deed = { facts = { kind = "dock", ship = "ship.player" } }
at_least = 25
effect = "Turn +10%"
modifiers = [{ modifier = "turn_rate", factor = 1.1 }]

# Dockings at stations whose snapshot was more than 10 dockings old: the economy
# records a `far_docking` fact for each (pending in W3).
[[rank]]
hull = "hull.heron"
rank = 2
name = "Far-sighted"
deed = { facts = { kind = "far_docking", ship = "ship.player" } }
at_least = 15
effect = "Long glass also refreshes stations within 2500 u at each jump"
modifiers = [{ modifier = "feature", feature = "long_glass_far" }]

[[rank]]
hull = "hull.heron"
rank = 3
name = "Quick"
deed = { facts = { kind = "jump", ship = "ship.player" } }
at_least = 20
effect = "Speed +5%"
modifiers = [{ modifier = "speed", factor = 1.05 }]


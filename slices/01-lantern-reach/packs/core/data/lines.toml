# Authored dock-talk lines (content/05-people.md). Each cites a fact kind, optionally
# narrowed by the fact's subjects (`ware`, `station`, `other`: an upgrade, trait, hull
# or ledger ID) and its exact `amount` (a `stage_built` fact's stage). On a docking,
# the station's people offer the lines whose fact is newer than the player's previous
# docking there; the decision model may pick one, and the game fills `{qty}`, `{ware}`
# and `{station}` from the cited fact. A fact any said line already cites isn't cited
# again, and a line retires after `max_uses` sayings. Lines whose conditions or slots
# the engine can't check yet (counts like `n >= 10`, `first`, `{trait_name}`, ranges
# like `stage >= 2`) wait until it can: no line is better than a wrong one.
# Read by galaxy-mind (`TalkLines`), not by the world loader.

max_uses = 3

# --- Ilse Marrow, dockmaster at Lantern Wharf ---
[[line]]
id = "line.ilse_marrow.01"
npc = "npc.ilse_marrow"
cites = "deliver"
other = "ledger.kettle_greenhouse"
text = "Odo's been counting your ice. He counts slower than I do, but he gets there."

[[line]]
id = "line.ilse_marrow.05"
npc = "npc.ilse_marrow"
cites = "shortage_started"
text = "Rimewater's thin. A lot of your ice is in our tanks, and not much is left out there."

[[line]]
id = "line.ilse_marrow.07"
npc = "npc.ilse_marrow"
cites = "market_flooded"
station = "station.brassmouth_exchange"
text = "Saffron says you sold Brassmouth so much glassite they're using it as doorstops."

[[line]]
id = "line.ilse_marrow.08"
npc = "npc.ilse_marrow"
cites = "prestige"
other = "hull.tandem"
text = "A Tandem. Wide in the hips. She'll carry what you can't."

[[line]]
id = "line.ilse_marrow.09"
npc = "npc.ilse_marrow"
cites = "prestige"
other = "hull.heron"
text = "A Heron. You'll see the prices before I do, then."

[[line]]
id = "line.ilse_marrow.11"
npc = "npc.ilse_marrow"
cites = "stage_built"
amount = 1
station = "station.kettle_dock"
text = "Odo's got a pane up at Kettle. One dome, and it fogs. He's never been prouder of anything."

# --- Orrin Vale, hullwright at Lantern Wharf ---
[[line]]
id = "line.orrin_vale.01"
npc = "npc.orrin_vale"
cites = "upgrade_fitted"
other = "upgrade.nav_chip"
text = "The chip's settling in. Ships take a few dockings to trust a new brain."

[[line]]
id = "line.orrin_vale.03"
npc = "npc.orrin_vale"
cites = "trait_earned"
other = "trait.ringwise"
text = "You don't dock any more, you arrive. The ring knows you."

[[line]]
id = "line.orrin_vale.04"
npc = "npc.orrin_vale"
cites = "trait_earned"
other = "trait.market_ear"
text = "You stop selling before the price does. That's an ear, that is."

[[line]]
id = "line.orrin_vale.06"
npc = "npc.orrin_vale"
cites = "trait_earned"
other = "trait.good_neighbour"
text = "Half the Shallows has your name in their ledgers. Nicely."

[[line]]
id = "line.orrin_vale.08"
npc = "npc.orrin_vale"
cites = "tender_acquired"
text = "Tamsin's tender? Sound little hull. Don't let it get ideas."

[[line]]
id = "line.orrin_vale.09"
npc = "npc.orrin_vale"
cites = "prestige"
text = "The Wren's on berth six. She'll be fine. I talk to her."

# --- Odo Fenn, head grower and dockmaster at Kettle Dock ---
[[line]]
id = "line.odo_fenn.01"
npc = "npc.odo_fenn"
cites = "deliver"
other = "ledger.kettle_greenhouse"
text = "{qty} ice. The beans will hear about this."

[[line]]
id = "line.odo_fenn.02"
npc = "npc.odo_fenn"
cites = "stage_built"
amount = 1
station = "station.kettle_dock"
text = "First pane's up. It fogs in the mornings. Well. When we call it morning."

[[line]]
id = "line.odo_fenn.08"
npc = "npc.odo_fenn"
cites = "shortage_started"
text = "Rimewater's thin and our tanks are thinner. I've two ideas, if you've a minute."

# --- Tamsin Oddway, tender keeper at Kettle Dock ---
[[line]]
id = "line.tamsin_oddway.04"
npc = "npc.tamsin_oddway"
cites = "market_flooded"
text = "You emptied a whole hold into {station}. A tender would've waited."

[[line]]
id = "line.tamsin_oddway.08"
npc = "npc.tamsin_oddway"
cites = "sell"
ware = "ware.ice"
station = "station.kettle_dock"
text = "Kettle's had its fill of ice just now. Little Pail will show you when it's thirsty again."

# --- Rook Adeyemi, Cinder Hook ---
[[line]]
id = "line.rook_adeyemi.01"
npc = "npc.rook_adeyemi"
cites = "deliver"
other = "ledger.hook_consignment"
text = "Ilse's plate. Tell her it's already holding up a wall."

[[line]]
id = "line.rook_adeyemi.07"
npc = "npc.rook_adeyemi"
cites = "dispute_started"
text = "Two banners want my depot. I want plate. Sell me plate in whose name you like, or nobody's."

# --- Juno Brask ---
[[line]]
id = "line.juno_brask.03"
npc = "npc.juno_brask"
cites = "rock_depleted"
ware = "ware.glassite"
text = "Glassite rocks glint when they go. Did you see it?"

[[line]]
id = "line.juno_brask.04"
npc = "npc.juno_brask"
cites = "fragment_found"
text = "A rock with a voice in it. Didn't I say? I definitely said."

[[line]]
id = "line.juno_brask.05"
npc = "npc.juno_brask"
cites = "rumor_heard"
text = "Ember Shoals, is it. I've heard that one before. Sometimes it's even true."

# --- Saffron Vey, Brassmouth Exchange ---
[[line]]
id = "line.saffron_vey.06"
npc = "npc.saffron_vey"
cites = "prestige"
other = "hull.heron"
text = "A Heron. You'll read my prices from across the Narrows. Do be kind."

# --- Nell Quillon, Glass Drift Observatory ---
[[line]]
id = "line.nell_quillon.02"
npc = "npc.nell_quillon"
cites = "fragment_found"
text = "You found it in a rock you mined yourself? Not bought? Not given? Good."

[[line]]
id = "line.nell_quillon.06"
npc = "npc.nell_quillon"
cites = "prestige"
other = "hull.heron"
text = "A Heron! Survey notes, please. As many as you can bear."

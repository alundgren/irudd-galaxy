# The five authored stations (the sixth is grown live by the game master).
# PROVISIONAL positions. Market lines follow the content spec's market tables
# (content/02-economy.md): role, base price, target stock, opening stock, the rate
# per station pulse (production or consumption), and for lines the station buys,
# saturation per unit sold and saturation recovered per pulse. Pulses come from
# activity (economy.toml), never a clock. The economy prices every line from the
# formula; `needs` stops production while an input is out of stock.
# Kettle Dock's rations (stage 2) and glassite (stage 3) arrive through market levers.
# Schema: crates/contract/schemas/data-stations.json

# Home station: dockmaster Ilse, the hullwright, buys iron.
[[station]]
id = "station.lantern_wharf"
name = "Lantern Wharf"
region = "region.lantern_shallows"
position = { x = -200.0, y = 150.0 }
dock_radius = 60.0
owner = "faction.wharf_cooperative"
services = ["market", "dockmaster", "hullwright"]
market = [
    { ware = "ware.ice", role = "buys", base_price = 10, target = 160, stock = 150, consumption = 2, sat_per_unit = 0.02, sat_recover = 0.05 },
    { ware = "ware.iron_ore", role = "buys", base_price = 14, target = 200, stock = 190, consumption = 3, sat_per_unit = 0.015, sat_recover = 0.05 },
    { ware = "ware.refined_plate", role = "sells", base_price = 30, target = 120, stock = 120, production = 2, needs = ["ware.iron_ore"] },
    { ware = "ware.glassite", role = "buys", base_price = 24, target = 80, stock = 70, consumption = 1, sat_per_unit = 0.03, sat_recover = 0.04 },
    { ware = "ware.rations", role = "sells", base_price = 14, target = 150, stock = 150, production = 2 },
]

# Greenhouse co-op that grows in stages from the ice and plate you bring.
[[station]]
id = "station.kettle_dock"
name = "Kettle Dock"
region = "region.lantern_shallows"
position = { x = 700.0, y = -450.0 }
dock_radius = 50.0
owner = "faction.wharf_cooperative"
services = ["market"]
stage = 0
parts = ["part.kettle.core"]
market = [
    { ware = "ware.ice", role = "buys", base_price = 12, target = 160, stock = 120, consumption = 3, sat_per_unit = 0.025, sat_recover = 0.05 },
    { ware = "ware.refined_plate", role = "buys", base_price = 38, target = 60, stock = 40, consumption = 1, sat_per_unit = 0.03, sat_recover = 0.04 },
]


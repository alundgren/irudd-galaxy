[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Shared dependency versions. Add new ones here and use `dep.workspace = true` in crates.
[workspace.dependencies]
# Our crates
galaxy-contract = { path = "crates/contract" }
galaxy-core = { path = "crates/core" }
galaxy-ship = { path = "crates/ship" }

# Third party (all MIT or MIT/Apache-2.0)
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
rand_core = "0.10.1"
rand_pcg = { version = "0.10.2", features = ["serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "warn"

# Dev builds: our code is lightly optimised so the game is playable, dependencies
# (wgpu, mlua, rusqlite ...) are optimised once and cached.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1

# Release: thin LTO only. Never fat LTO; build time matters more than the last few percent.
[profile.release]
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"
